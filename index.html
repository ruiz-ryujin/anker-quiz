<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<!-- 外部への送信を遮断（読み込むのは同じ場所の questions.json と images/ だけ） -->
<meta http-equiv="Content-Security-Policy" content="connect-src 'self'; form-action 'none'; font-src 'none'; frame-src 'none'; object-src 'none'">
<title>Anker 商品クイズ</title>
<link rel="icon" href="data:,">
<style>
:root{
  --blue:#00A0E9; --blue-soft:rgba(0,160,233,.16); --on-blue:#00121C;
  --bg:#000; --s1:#121416; --s2:#1B1E21; --line:#2C3136; --line2:#454C53;
  --text:#fff; --sub:#A9B1B8;
  --ng:#FF6B61; --ng-soft:rgba(255,107,97,.14);
  --r:16px;
  --font:"Helvetica Neue",Arial,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Noto Sans CJK JP","Yu Gothic UI",Meiryo,sans-serif;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-padding-top:80px}
body{margin:0;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;background:var(--bg);color:var(--text);
  font-family:var(--font);font-size:16px;line-height:1.65;overflow-wrap:anywhere;-webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased}
h1,h2,h3,p,ul,ol,dl,dd{margin:0;padding:0}
ul,ol{list-style:none}
h1,h2,h3{line-height:1.35;word-break:auto-phrase;text-wrap:pretty}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
img{display:block;max-width:100%}
:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
[tabindex="-1"]:focus{outline:none}
.wrap{width:100%;max-width:1120px;margin:0 auto;padding-left:max(20px,env(safe-area-inset-left));padding-right:max(20px,env(safe-area-inset-right))}

/* ヘッダー */
.head{position:sticky;top:0;z-index:10;background:rgba(0,0,0,.92);border-bottom:1px solid var(--line)}
.head .wrap{min-height:60px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.brand{background:none;border:0;padding:8px 0;min-height:44px;font-size:17px;font-weight:700;white-space:nowrap}
.brand b{color:var(--blue);letter-spacing:.06em;margin-right:8px}
.quit{background:none;border:1px solid var(--line2);border-radius:999px;min-height:40px;padding:0 16px;font-size:14px;white-space:nowrap}
.bar{height:3px;background:var(--line)}
.bar i{display:block;height:100%;width:0;background:var(--blue);transition:width .3s}
main{flex:1}
.foot{color:var(--sub);font-size:13px;padding:28px 0 calc(28px + env(safe-area-inset-bottom))}

/* ホーム */
.hero{padding:48px 0 32px}
.hero h1{font-size:clamp(32px,6.4vw,56px);font-weight:700;letter-spacing:.01em;line-height:1.2}
.hero p{margin-top:12px;color:var(--sub);font-size:clamp(15px,2vw,18px)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;padding-bottom:24px}
.grid li:last-child{grid-column:1/-1}
.cat{width:100%;height:100%;padding:0;border:1px solid var(--line);border-radius:var(--r);background:var(--s1);overflow:hidden;
  display:flex;flex-direction:column;text-align:left;transition:border-color .15s,transform .15s}
.cat:active{transform:scale(.985)}
.cat .pic{background:#fff;width:100%;height:clamp(104px,27vw,190px);flex:none;display:flex;align-items:center;justify-content:center;gap:4%;padding:12px}
.cat .pic img{height:100%;width:100%;min-width:0;flex:1 1 0;object-fit:contain}
.cat .txt{padding:14px 16px 16px;display:flex;flex-direction:column;gap:2px;flex:1}
.cat .name{font-weight:700;font-size:16px;line-height:1.4;word-break:auto-phrase}
.cat .cnt{color:var(--sub);font-size:14px}
.cat.mix{background:var(--blue);border-color:var(--blue);color:var(--on-blue)}
.cat.mix .cnt{color:var(--on-blue)}
@media(hover:hover){.cat:hover{border-color:var(--blue)}.quit:hover,.btn.ghost:hover{border-color:#fff}}
@media(min-width:760px){
  .hero{padding:72px 0 44px}
  .grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
  .grid li:last-child{grid-column:auto}
  .cat .name{font-size:19px}.cat .txt{padding:18px 20px 20px}
}

/* 種類 → 分野 */
.cat .desc{color:var(--sub);font-size:13px;line-height:1.5}
.cat.mix .desc{color:var(--on-blue)}
.cat:disabled{opacity:.42;cursor:not-allowed}
.cat:disabled:active{transform:none}
.sub{padding:28px 0 22px}
.sub h1{margin-top:20px;font-size:clamp(28px,5.4vw,44px);font-weight:700;line-height:1.25}
.sub p{margin-top:8px;color:var(--sub)}
.back{min-height:44px;padding:8px 20px;font-size:14px}
@media(min-width:760px){.grid.kinds{grid-template-columns:repeat(2,minmax(0,1fr))}.grid.kinds li:last-child{grid-column:1/-1}}
@media(min-width:1000px){.grid.kinds{grid-template-columns:repeat(4,minmax(0,1fr))}}

/* ボタン */
.btn{min-height:52px;padding:12px 28px;border-radius:999px;border:1px solid var(--blue);background:var(--blue);color:var(--on-blue);font-weight:700}
.btn.ghost{background:transparent;border-color:var(--line2);color:#fff}
.btn:disabled{background:var(--s2);border-color:var(--s2);color:#7E878E;cursor:not-allowed}

/* 問題数選択・メッセージ */
.narrow{max-width:760px;padding-top:40px;padding-bottom:64px}
.narrow h1{font-size:clamp(26px,5vw,38px)}
.lead{color:var(--sub);margin-top:8px}
.stack{display:grid;gap:12px;margin-top:28px}
@media(min-width:600px){.stack.row{grid-template-columns:repeat(4,1fr)}.stack.row .btn{padding-left:8px;padding-right:8px}}

/* 出題 */
.quiz{max-width:1120px;padding-top:24px;padding-bottom:120px}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;color:var(--sub);font-size:14px}
.meta strong{color:#fff;font-variant-numeric:tabular-nums}
.tag{padding:2px 12px;border-radius:999px;background:var(--blue-soft);color:#6FCBF5;font-weight:700;font-size:13px}
.q{margin-top:12px;font-size:clamp(20px,4.6vw,28px);font-weight:700;line-height:1.5}
.shot{background:#fff;border-radius:var(--r);display:flex;justify-content:center;align-items:center;padding:16px;margin-top:20px}
.shot{gap:16px}
.shot figure{margin:0;flex:1 1 0;min-width:0}
.shot img{height:clamp(130px,24vh,210px);width:100%;object-fit:contain}
.shot.sm{padding:10px} .shot.sm img{height:clamp(110px,17vh,150px)}
.shot figcaption{margin-top:10px;color:#111;font-size:13px;font-weight:700;line-height:1.4;text-align:center}
.answers{margin-top:20px;display:grid;gap:10px}
.opt{width:100%;min-height:60px;padding:14px 16px;border-radius:14px;border:1px solid var(--line2);background:var(--s1);text-align:left;
  display:flex;align-items:center;gap:14px;line-height:1.5;transition:border-color .15s,background .15s}
.opt .k{flex:none;width:30px;height:30px;border-radius:50%;border:1px solid var(--line2);display:grid;place-items:center;font-size:14px;font-weight:700;color:var(--sub);font-variant-numeric:tabular-nums}
.opt .w{flex:1}
/* 商品名の選択肢：写真＋名前 */
.answers.pics{grid-template-columns:repeat(2,minmax(0,1fr))}
.answers.pics>*{min-width:0}
.answers.pics .fb{grid-column:1/-1}
.answers.pics .opt{position:relative;flex-direction:column;align-items:stretch;gap:0;padding:0;overflow:hidden}
.opt .ph{display:flex;gap:6px;height:clamp(104px,29vw,150px);flex:none;padding:10px;background:#fff}
.opt .ph img{flex:1 1 0;min-width:0;width:100%;height:100%;object-fit:contain}
.opt .ph.none{align-items:center;justify-content:center;background:var(--s2);color:var(--sub);font-size:13px}
.answers.pics .opt .k{position:absolute;top:8px;left:8px;background:var(--s1);color:#fff}
.answers.pics .opt .w{padding:10px 12px 12px;font-size:14px;line-height:1.45}
.answers.pics .opt.ok .k{background:var(--blue);color:var(--on-blue)} .answers.pics .opt.ng .k{background:var(--ng);color:#200}
.opt.dim .ph{opacity:.55}
.picname{display:flex;align-items:center;gap:10px;margin-top:6px}
.picname img{width:56px;height:56px;object-fit:contain;background:#fff;border-radius:10px;padding:4px;flex:none}
@media(hover:hover){.opt:not(:disabled):hover{border-color:var(--blue)}}
.opt:disabled{cursor:default;color:#fff;opacity:1}
.opt.dim{color:var(--sub);border-color:var(--line)}
.opt.ok{border-color:var(--blue);background:var(--blue-soft)}
.opt.ok .k,.opt.on .k{background:var(--blue);border-color:var(--blue);color:var(--on-blue)}
.opt.ng{border-color:var(--ng);background:var(--ng-soft)}
.opt.ng .k{background:var(--ng);border-color:var(--ng);color:#200}
.opt.on{border-color:var(--blue)}
/* 複数選択 */
.answers>.hint{margin-top:0}
.answers.pics>.hint,.answers.pics>.tools{grid-column:1/-1}
.answers.pics .opt.on{border-color:var(--blue);box-shadow:0 0 0 1px var(--blue);background:var(--blue-soft)}
.answers.pics .opt.on .k{background:var(--blue);color:var(--on-blue)}
.opt .w small{display:block;color:#6FCBF5;font-size:13px;font-weight:700}
.card .ph.two{gap:14px;align-items:flex-start}
.card .ph.two figure{margin:0;flex:1 1 0;min-width:0}
.card .ph.two img{height:150px}
.card .ph.two figcaption{margin-top:8px;font-size:13px;font-weight:700;line-height:1.4;text-align:center}
.hint{color:var(--sub);font-size:14px;margin-top:16px}
.tools{display:flex;gap:12px;margin-top:18px;flex-wrap:wrap}
.tools .btn{flex:1 1 140px}

.fb{margin-top:24px;border-radius:var(--r);background:var(--s1);border:1px solid var(--line);padding:22px 20px;scroll-margin:calc(80px + var(--gh,0px)) 0 104px}
.verdict{font-size:24px;font-weight:700;display:flex;align-items:center;gap:10px}
.verdict svg{width:30px;height:30px;flex:none}
.fb.good .verdict{color:var(--blue)} .fb.bad .verdict{color:var(--ng)}
.right{margin-top:10px;font-weight:700}
.right>span:first-child{color:var(--sub);font-weight:400;font-size:14px;display:block}
.exp{margin-top:12px;color:#DDE2E6}
.card{margin-top:18px;background:#fff;color:#111;border-radius:14px;overflow:hidden;display:grid}
.card .ph{padding:18px;display:flex;justify-content:center;align-items:center}
.card .ph img{height:190px;width:100%;object-fit:contain}
.card .bd{background:#F3F5F6;padding:18px 20px}
.card .lbl{font-size:13px;font-weight:700;color:#00649A}
.card h3{font-size:19px;margin-top:2px}
.card .pt{font-size:13px;font-weight:700;color:#00649A;margin-top:12px}
.card p{font-size:15px;color:#2A3035}
.mini{margin-top:18px;display:flex;gap:14px;align-items:center}
.mini img{width:84px;height:84px;object-fit:contain;background:#fff;border-radius:12px;padding:6px;flex:none}
.mini b{font-size:15px;line-height:1.45}
.steps{margin-top:14px;display:grid;gap:8px}
.steps li{display:flex;gap:12px;align-items:flex-start;padding:10px 12px;border-radius:12px;background:var(--s2)}
.steps .k{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:700;background:var(--blue);color:var(--on-blue);margin-top:1px}
.steps .w{flex:1}
.steps small{display:block;color:var(--sub);font-size:13px}
.steps li.miss .k{background:var(--ng);color:#200}
.steps li.miss small{color:#FF9A93}

.next{position:fixed;left:0;right:0;bottom:0;z-index:9;padding:12px 0 calc(12px + env(safe-area-inset-bottom));background:rgba(0,0,0,.92);border-top:1px solid var(--line)}
.next .btn{width:100%}
@media(min-width:900px){
  .quiz.has-shot .body{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:32px;align-items:start;margin-top:24px}
  .quiz.has-shot .shot,.quiz.has-shot .answers{margin-top:0}
  .quiz.has-shot .hint:first-child{margin-top:0}
  .quiz.has-shot .shot img{height:300px}
  .quiz:not(.has-shot){max-width:860px}
  .opt .ph{height:170px}
  .answers.pics .opt .w{font-size:15px}
  .next .wrap{display:flex;justify-content:flex-end}
  .next .btn{width:auto;min-width:260px}
  .card{grid-template-columns:minmax(0,2fr) minmax(0,3fr)}
  .card .bd{padding:24px}
  .card .ph img{height:220px}
}

/* パスとチェック */
.qbar{display:flex;gap:12px;margin-top:20px}
.qbar>*{flex:1 1 0}
.pass,.chk{min-height:52px;padding:8px 18px;border-radius:999px;border:1px solid var(--line2);background:transparent;color:#fff;font-weight:700}
.chk{display:flex;align-items:center;justify-content:center;gap:8px}
.chk svg{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linejoin:round}
.chk[aria-pressed=true]{border-color:var(--blue);background:var(--blue-soft);color:#6FCBF5}
.chk[aria-pressed=true] svg{fill:currentColor}
.next .wrap{display:flex;gap:12px}
.next .btn{flex:1 1 auto}
.next .chk{flex:none}
.marked{width:100%;margin-bottom:24px}
.tally{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:24px}
.tally div{padding:12px 14px;border-radius:14px;background:var(--s1);border:1px solid var(--line)}
.tally dt{color:var(--sub);font-size:14px}
.tally dd{font-size:26px;font-weight:700;line-height:1.3;font-variant-numeric:tabular-nums}
.tally .g dd{color:var(--blue)} .tally .b dd{color:var(--ng)}
.actions+.hint{margin-top:10px}
.hint+.actions,.actions+.actions{margin-top:12px}
@media(hover:hover){.pass:hover,.chk:hover{border-color:#fff}}
@media(min-width:900px){.qbar{justify-content:flex-end}.qbar>*{flex:0 0 180px}.next .btn{flex:none}}

/* 用語解説 */
.term{color:var(--blue);text-decoration:underline dotted;text-decoration-thickness:2px;text-underline-offset:.22em;cursor:pointer;
  padding:.3em 0;border-radius:4px;word-break:keep-all;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.term.on{background:var(--blue-soft);text-decoration-style:solid}
.card .term{color:#00649A}
.gloss{background:#06202D;border-top:1px solid var(--blue);border-bottom:1px solid var(--blue)}
.gloss .wrap{min-height:0;align-items:flex-start;padding-top:12px;padding-bottom:14px}
.gloss .tx{flex:1;min-width:0;max-height:38vh;overflow:auto}
.gloss .tt{font-size:17px;font-weight:700;line-height:1.4;color:#6FCBF5}
.gloss .as{color:var(--sub);font-size:13px;font-weight:400;margin-left:8px}
.gloss .td{margin-top:4px;font-size:15px;line-height:1.6}
.gloss .x{flex:none;min-height:44px;padding:0 16px;border-radius:999px;border:1px solid var(--line2);background:transparent;color:#fff;font-size:14px;font-weight:700;white-space:nowrap}
@media(hover:hover){.term:hover{background:var(--blue-soft)}.card .term:hover,.card .term.on{background:rgba(0,160,233,.18)}.gloss .x:hover{border-color:#fff}}

/* 結果 */
.score{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 20px;margin-top:12px}
.score .big{font-size:clamp(56px,14vw,96px);font-weight:700;line-height:1;color:var(--blue);font-variant-numeric:tabular-nums}
.score .big small{font-size:.4em;margin-left:.08em}
.score .of{font-size:20px;font-variant-numeric:tabular-nums}
.actions{display:grid;gap:12px;margin-top:28px}
@media(min-width:600px){.actions{grid-auto-flow:column;grid-auto-columns:1fr}}
.sec{margin-top:44px;font-size:20px;font-weight:700}
.res{margin-top:14px;display:grid;gap:16px}
.res .ln{display:flex;justify-content:space-between;gap:12px}
.res .ln span:last-child{color:var(--sub);font-variant-numeric:tabular-nums;white-space:nowrap}
.meter{height:6px;border-radius:99px;background:var(--s2);margin-top:6px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--blue);border-radius:99px}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<header class="head">
  <div class="wrap">
    <button class="brand" id="brand" type="button"><b>ANKER</b>商品クイズ</button>
    <button class="quit" id="quit" type="button" hidden>ここで終了</button>
  </div>
  <div class="bar" id="bar" role="progressbar" aria-label="進み具合" aria-valuemin="0" hidden><i></i></div>
  <section class="gloss" id="gloss" aria-label="用語の説明" aria-live="polite" hidden><div class="wrap">
    <div class="tx"><p class="tt" id="gloss-t"></p><p class="td" id="gloss-d"></p></div>
    <button class="x" id="gloss-x" type="button" aria-label="用語の説明を閉じる">× 閉じる</button>
  </div></section>
</header>
<main id="app"></main>
<footer class="foot" id="foot"><div class="wrap">社内学習用。回答はこの端末の中だけで処理され、外部には送信されません。</div></footer>

<script type="application/json" id="embedded-questions">[{"id":"chg-01","category":"チャージャー","type":"おすすめ","question":"お客さま「来月、海外旅行に行く。いろいろな国のコンセントで、スマホやイヤホンを充電したい」。どれをすすめる？","choices":["323 Charger (33W)","Nano Charger (20W)","Nano トラベルアダプタ (5-in-1, 20W)","Nano Charger (70W, 3 Ports)"],"answer_index":2,"explanation":"200以上の国と地域（A・C・Gタイプ）に対応し、最大5台をつなげる。行き先を先に聞き、そのコンセントの形に合うかを確認して案内する。","product":"Anker Nano トラベルアダプタ (5-in-1, 20W)","image":"images/anker-nano-travel-adapter-5-in-1-20w.png","kind":"お客さん対応"},{"id":"chg-02","category":"チャージャー","type":"知識","question":"「Nano トラベルアダプタ (5-in-1, 20W)」を案内するとき、必ず確認したいことは？","choices":["ケーブルが巻取り式かどうか","変圧機能がないので、使う機器が100〜240Vに対応しているか","スマホに専用アプリが入っているか","使う機器がマグネットに対応しているか"],"answer_index":1,"explanation":"変圧機能はない。海外の電圧にそのまま対応する機器（100〜240V対応）かどうかを、機器側の表示で確認してもらう。","product":"Anker Nano トラベルアダプタ (5-in-1, 20W)","image":"images/anker-nano-travel-adapter-5-in-1-20w.png","kind":"商品知識"},{"id":"chg-03","category":"チャージャー","type":"おすすめ","question":"お客さま「海外出張にノートPCも持って行く。コンセントの変換と、ノートPCの充電を1つで済ませたい」。どれをすすめる？","choices":["Nano II 65W","Nano トラベルアダプタ (5-in-1, 20W)","Nano Universal Charger (100W, Display)","Charger (100W, 3 Ports)"],"answer_index":2,"explanation":"200以上の国と地域に対応し、最大100W・4台同時に充電できる。5-in-1のトラベルアダプタは最大20Wなので、ノートPCには力不足。オーストラリアなどのIタイプは非対応。","product":"Anker Nano Universal Charger (4-in-1, 100W, Display)","image":"images/nano-universal-charger-100w-display.jpg","kind":"お客さん対応"},{"id":"chg-04","category":"チャージャー","type":"おすすめ","question":"お客さま「ケーブルを別に持ち歩くのが面倒。使うときだけ引き出せる充電器はない？」。どれをすすめる？","choices":["Nano Charger (35W, 巻取り式USB-Cケーブル)","Nano Charger (20W)","323 Charger (33W)","523 Charger (Nano 3, 47W)"],"answer_index":0,"explanation":"約70cmの巻取り式USB-Cケーブルが本体に付いている。USB-Cポートもあり2台同時に充電できる。お客さまの機器の端子がUSB-Cかを先に確認する。","product":"Anker Nano Charger (35W, 巻取り式 USB-Cケーブル)","image":"images/nano-charger-35w-retractable.jpg","kind":"お客さん対応"},{"id":"chg-05","category":"チャージャー","type":"数字","question":"Nano Charger (35W, 巻取り式USB-Cケーブル) のケーブルの長さは？","choices":["約3m","約30cm","約70cm","約1.5m"],"answer_index":2,"explanation":"約70cm。コンセントのそばで使うには十分だが、ベッドやソファまで延ばしたいお客さまには長いケーブルを別に案内する。","product":"Anker Nano Charger (35W, 巻取り式 USB-Cケーブル)","image":"images/nano-charger-35w-retractable.jpg","kind":"商品知識"},{"id":"chg-06","category":"チャージャー","type":"知識","question":"「Charger (140W, 4 Ports)」はどんな充電器？","choices":["USB-C×3とUSB-A×1の4ポートで、出力や温度を画面で確認できる","巻取り式ケーブルが付いた2ポートの充電器","スマホを貼り付けるマグネット式のワイヤレス充電器","海外のコンセントに対応したトラベルアダプタ"],"answer_index":0,"explanation":"合計最大140W・4台同時。ディスプレイ付きで、タッチ式ボタンで表示を切り替えられる。16インチMacBook Proのような大型ノートPCのお客さまにも案内できる。","product":"Anker Charger (140W, 4 Ports) with USB-C & USB-C ケーブル","image":"images/charger-140w-4-ports.jpg","kind":"商品知識"},{"id":"chg-07","category":"チャージャー","type":"おすすめ","question":"お客さま「コンセントまわりが狭いので、プラグの向きを変えられる充電器がいい。充電の様子が画面で見えるとうれしい」。どれをすすめる？","choices":["Nano II 65W","Nano Charger (45W, Display, スイングプラグ)","Charger (100W, 3 Ports)","511 Charger (Nano 3, 30W)"],"answer_index":1,"explanation":"二方向に動く折りたたみスイングプラグと、出力・温度・バッテリー残量のディスプレイを備える。100Wの3ポートモデルも画面付きだが、スイングプラグではない。","product":"Anker Nano Charger (45W, Display, スイングプラグ)","image":"images/nano-charger-45w-display-swing-plug.jpg","kind":"お客さん対応"},{"id":"chg-09","category":"チャージャー","type":"おすすめ","question":"お客さま「手持ちのUSB-AのケーブルとUSB-Cのケーブルを、両方そのまま使える小さい充電器がほしい」。どれをすすめる？","choices":["323 Charger (33W)","Nano Charger (20W)","523 Charger (Nano 3, 47W)","Nano Charger (35W, 巻取り式USB-Cケーブル)"],"answer_index":0,"explanation":"USB-CとUSB-Aが1つずつの2ポート。ほかの3つにはUSB-Aポートがない。お手持ちのケーブルの端子を確認してから案内する。","product":"Anker 323 Charger (33W)","image":"images/323-charger-33w.jpg","kind":"お客さん対応"},{"id":"chg-10","category":"チャージャー","type":"知識","question":"「Nano Charger (45W) ケーブル同梱版」はどんな充電器？","choices":["スイングプラグとディスプレイが付いている","デスクに置いて使う6ポートタイプ","小型で最大45W、USB-Cケーブル（1.8m）が一緒に入っている","ケーブルが本体に巻き取られる"],"answer_index":2,"explanation":"1.8mのUSB-C & USB-Cケーブルが同梱で、買ってすぐ使える。同じ45Wでも、ディスプレイとスイングプラグが付いた別モデルがあるので混同しない。","product":"Anker Nano Charger (45W) with USB-C & USB-C ケーブル","image":"images/nano-charger-45w.png","kind":"商品知識"},{"id":"chg-11","category":"チャージャー","type":"知識","question":"「Prime Charger (160W, 3 Ports)」の紹介ポイントは？","choices":["コンセントの差込口も増やせる","クレジットカードより小さいのに、単ポート最大140W","スマホを貼り付けて充電できる","本体にバッテリーを内蔵している"],"answer_index":1,"explanation":"単ポート最大140W・合計最大160Wで、クレジットカードより小さい。ノートPCを持ち歩くお客さまに「1個で荷物が減ります」と案内できる。","product":"Anker Prime Charger (160W, 3 Ports)","image":"images/prime-charger-160w-3-ports.png","kind":"商品知識"},{"id":"chg-12","category":"チャージャー","type":"おすすめ","question":"お客さま「仕事机に置いて、ノートPCやスマホなど5台以上をまとめて充電したい。画面が付いているものがいい」。どれをすすめる？","choices":["Nano Charger (70W, 3 Ports)","Prime Charger (200W, 6 Ports)","Prime Wall Charger (67W, 3 ports)","Prime Charger (250W, 6 Ports)"],"answer_index":3,"explanation":"卓上型・6ポートで、ディスプレイと操作ダイヤルが付く。200Wも同じ6ポートの卓上型だが、画面とダイヤルで管理したい方には250W。","product":"Anker Prime Charger (250W, 6 Ports, GaN)","image":"images/prime-charger-250w-6-ports.jpg","kind":"お客さん対応"},{"id":"chg-13","category":"チャージャー","type":"おすすめ","question":"お客さま「スマホを立てて見ながら、ワイヤレス充電したい」。どれをすすめる？","choices":["MagGo Wireless Charger (Stand)","PowerWave 10 Pad","Nano Charger (20W)","Zolo Wireless Charger (Magnetic, Pad)"],"answer_index":0,"explanation":"立てて使うスタンド型で、縦向きにも横向きにもできる。25W以上の充電器は別売りなので一緒に案内する。「Stand」は立てるタイプ、「Pad」は置くタイプの目印。","product":"Anker MagGo Wireless Charger (Stand)","image":"images/maggo-wireless-charger-stand.jpg","kind":"お客さん対応"},{"id":"chg-14","category":"チャージャー","type":"数字","question":"「Zolo Wireless Charger (Magnetic, Pad)」のワイヤレス出力は最大何W？","choices":["7.5W","25W","5W","15W"],"answer_index":3,"explanation":"最大15W（Qi2）。ただし20W以上のUSB-C充電器が別売りで必要。iPhone 16eは非対応なので機種を確認する。","product":"Anker Zolo Wireless Charger (Magnetic, Pad)","image":"images/zolo-wireless-charger-magnetic-pad.jpg","kind":"商品知識"},{"id":"chg-15","category":"チャージャー","type":"おすすめ","question":"お客さま「出張先で、iPhone・Apple Watch・イヤホンをまとめてワイヤレス充電したい。折りたためて、充電も速いのがいい」。どれをすすめる？","choices":["Prime Wireless Charging Station (3-in-1, MagGo, AirCool, Foldable)","PowerWave 10 Pad","MagGo Wireless Charger (Stand)","Zolo Wireless Charger (Magnetic, Pad)"],"answer_index":0,"explanation":"3台同時に充電できる折りたたみ式。スマホは最大25W（Qi2 25W）で、冷却ファンも内蔵。ほかの3つは3台同時には充電できない。","product":"Anker Prime Wireless Charging Station (3-in-1, MagGo, AirCool, Foldable)","image":"images/prime-wireless-charging-station-3-in-1-foldable.png","kind":"お客さん対応"},{"id":"chg-16","category":"チャージャー","type":"知識","question":"Anker Primeのワイヤレス充電器の名前に付く「AirCool」は、どんな特徴？","choices":["水に濡れても充電できる","ケーブルを本体に巻き取れる","冷却ファンで冷やしながら充電できる","バッテリーを内蔵している"],"answer_index":2,"explanation":"充電中の熱を冷却ファンで抑える仕組み。「ワイヤレス充電は熱くなるのが心配」というお客さまへの説明に使える。","product":"Anker Prime Wireless Charging Station (3-in-1, MagGo, AirCool, Dock Stand)","image":"images/prime-wireless-charging-station-3-in-1-dock-stand.png","kind":"商品知識"},{"id":"chg-17","category":"チャージャー","type":"おすすめ","question":"お客さま「机の天板に挟んで固定できる電源タップがほしい。工具は使いたくない」。どれをすすめる？","choices":["Nano Charging Station (6-in-1, 67W)","Nano Power Strip (10-in-1, 70W, クランプ式)","Prime Charging Station (8-in-1, 240W)","Nano Charging Station (7-in-1, 100W, 巻取り式)"],"answer_index":1,"explanation":"工具不要でデスクに挟むだけ。対応する天板の厚みは15〜45mmで、ガラス製には使えない。机の材質と厚みを必ず確認する。","product":"Anker Nano Power Strip (10-in-1, 70W, クランプ式)","image":"images/nano-power-strip-10-in-1-70w-clamp.jpg","kind":"お客さん対応"},{"id":"chg-18","category":"チャージャー","type":"おすすめ","question":"お客さま「電源タップがほしい。USB-Cケーブルも付いていて、使わないときは本体にしまえるのがいい」。どれをすすめる？","choices":["Nano Charging Station (7-in-1, 100W, 巻取り式)","Prime Charging Station (8-in-1, 240W)","Nano Power Strip (10-in-1, 70W, クランプ式)","Nano Charging Station (6-in-1, 67W)"],"answer_index":0,"explanation":"約70cmの巻取り式USB-Cケーブルを2本備え、コンセント差込口も3つある。机の上をすっきりさせたいお客さまに合う。","product":"Anker Nano Charging Station (7-in-1, 100W, 巻取り式 USB-Cケーブル)","image":"images/nano-charging-station-7-in-1-100w-retractable.png","kind":"お客さん対応"},{"id":"chg-19","category":"チャージャー","type":"おすすめ","question":"お客さま「旅行先のホテルで使う電源タップがほしい。薄くて軽く、コンセントに挿す家電も2つ使いたい」。どれをすすめる？","choices":["Nano Charging Station (6-in-1, 67W)","Prime Charger (250W, 6 Ports)","Nano Power Strip (10-in-1, 70W, クランプ式)","Nano Charging Station (7-in-1, 100W, 巻取り式)"],"answer_index":0,"explanation":"厚さ約19mm・約298gの薄型で、持ち運び向き。コンセント差込口2つとUSB 4ポートで6台同時に使える。","product":"Anker Nano Charging Station (6-in-1, 67W)","image":"images/nano-charging-station-6-in-1-67w.jpg","kind":"お客さん対応"},{"id":"chg-20","category":"チャージャー","type":"手順","question":"Anker Prime Wireless Charging Station (3-in-1) をAnkerのアプリに初めて接続する手順を、正しい順に並べよう","choices":["Ankerのアプリを入れ、スマホのBluetoothをオンにして充電器の近く（10m以内）に置く","アプリの「＋」または Devices から Add Device を開く","表示された充電器の名前をタップする","見つからないときだけ、Manually Add で型番「A25X7」を検索して追加する"],"answer_index":0,"explanation":"アプリでは充電状況の確認や、充電モード・画面の明るさの変更ができる。自動で見つからなければ型番検索で手動追加、と覚える。※アプリのメニュー名は公式サポート（英語）の表記。日本語アプリでは表示が異なる場合がある。","product":"Anker Prime Wireless Charging Station (3-in-1, MagGo, AirCool, Dock Stand)","image":"images/prime-wireless-charging-station-3-in-1-dock-stand.png","kind":"使い方"},{"id":"chg-k01","category":"チャージャー","type":"知識","question":"「323 Charger (33W)」のポート構成は？","choices":["USB-C×2とUSB-A×1","USB-C×1だけ","USB-C×1とUSB-A×1","USB-C×2"],"answer_index":2,"explanation":"USB-CとUSB-Aを1つずつ備え、2台同時に充電できる。2ポート使うときはUSB-C 20W＋USB-A 12W。","product":"Anker 323 Charger (33W)","image":"images/323-charger-33w.jpg","kind":"商品知識"},{"id":"chg-k02","category":"チャージャー","type":"知識","question":"「323 Charger (33W)」の案内として正しいのは？","choices":["充電の様子を画面で確認できる","折りたたみ式プラグで、ケーブルは別売り","コンセントの差込口も増やせる","USB-Cケーブルが本体に付いている"],"answer_index":1,"explanation":"折りたたみ式プラグで約56g。ケーブルは別売りなので、手持ちのケーブルがあるかを確認する。","product":"Anker 323 Charger (33W)","image":"images/323-charger-33w.jpg","kind":"商品知識"},{"id":"chg-k03","category":"チャージャー","type":"数字","question":"「523 Charger (Nano 3, 47W)」を1ポートだけで使うとき、最大出力は？","choices":["30W","100W","45W","20W"],"answer_index":2,"explanation":"名前は47Wだが、1ポートでは最大45W。47Wは2ポートを使うとき（27W＋20W）の合計。","product":"Anker 523 Charger (Nano 3, 47W)","image":"images/523-charger-nano-3-47w.jpg","kind":"商品知識"},{"id":"c me Wireless Charging Station (3-in-1, MagGo, AirCool, Foldable)"]},{"id":"bat-01","category":"バッテリー","type":"知識","question":"「Power Bank (30W, Fusion, Built-in USB-Cケーブル)」はどんな商品？","choices":["Lightning端子を直接挿すバッテリー","専用ベースに置いて充電するPrimeのバッテリー","マグネットでスマホの背面に付けるバッテリー","コンセントに挿せる充電器とバッテリーとケーブルが1つになった商品"],"answer_index":3,"explanation":"Fusionは充電器・モバイルバッテリー・ケーブルの3-in-1。コンセントに挿すだけで本体も充電できる。荷物を減らしたいお客さまに。","product":"Anker Power Bank (30W, Fusion, Built-In USB-C ケーブル)","image":"images/power-bank-30w-fusion-built-in-usb-c.jpg","kind":"商品知識"},{"id":"bat-02","category":"バッテリー","type":"おすすめ","question":"お客さま「充電器とバッテリーを1つにまとめたい。ノートPCも使うので、パワーがあるほうがいい」。どれをすすめる？","choices":["Power Bank (20000mAh, 30W)","Power Bank (10000mAh, Fusion, Built-in USB-Cケーブル)","Prime Power Bank (9600mAh, 65W, Fusion)","Power Bank (30W, Fusion, Built-in USB-Cケーブル)"],"answer_index":2,"explanation":"充電器としてもバッテリーとしても最大65W。ほかのFusion 2種は最大30W。20000mAhのPower Bankはコンセントに直接挿せない。","product":"Anker Prime Power Bank (9600mAh, 65W, Fusion)","image":"images/prime-power-bank-9600mah-65w-fusion.jpg","kind":"お客さん対応"},{"id":"bat-03","category":"バッテリー","type":"おすすめ","question":"お客さま「Lightning端子のiPhoneを使っている。ケーブルなしで、端子に直接挿して充電したい」。どれをすすめる？","choices":["Nano Power Bank (12W, Built-in Lightning Connector)","Zolo Power Bank (20000mAh, 30W, Built-in USB-C / Lightningケーブル)","Power Bank (20000mAh, 30W)","Nano Power Bank (22.5W, Built-in USB-C Connector)"],"answer_index":0,"explanation":"折りたたみ式のLightning端子が本体に付いている。「Connector」は端子一体型、「ケーブル」はケーブル一体型。iPhoneの端子がLightningかUSB-Cかを必ず確認する。","product":"Anker Nano Power Bank (12W, Built-In Lightning Connector)","image":"images/nano-power-bank-12w-lightning-connector.jpg","kind":"お客さん対応"},{"id":"bat-04","category":"バッテリー","type":"知識","question":"「Nano Power Bank (22.5W, Built-in USB-C Connector)」の使い方は？","choices":["専用ベースに置く","コンセントに直接挿す","マグネットでスマホの背面に付ける","USB-C端子をスマホに直接挿す"],"answer_index":3,"explanation":"USB-C端子一体型でケーブル不要。5000mAhでスマホ約1回分、約102gと軽い。USB-CのスマホやiPhone 15以降のお客さまに。","product":"Anker Nano Power Bank (22.5W, Built-In USB-C Connector)","image":"images/nano-power-bank-22-5w-usb-c-connector.jpg","kind":"使い方"},{"id":"bat-05","category":"バッテリー","type":"おすすめ","question":"お客さま「自分のスマホはUSB-C、家族のiPhoneはLightning。どちらも内蔵ケーブルで充電できるものがほしい」。どれをすすめる？","choices":["Nano Power Bank (12W, Built-in Lightning Connector)","Power Bank (20000mAh, 87W, Built-in USB-Cケーブル)","Nano Power Bank (10000mAh, 45W, 巻取り式USB-Cケーブル)","Zolo Power Bank (20000mAh, 30W, Built-in USB-C / Lightningケーブル)"],"answer_index":3,"explanation":"USB-CとLightningの2種類のケーブルを内蔵し、最大4台同時に充電できる。端子が混在するご家庭に案内しやすい。","product":"Anker Zolo Power Bank (20000mAh, 30W, Built-In USB-C / ライトニングケーブル)","image":"images/zolo-power-bank-20000mah-30w-usb-c-lightning.jpg","kind":"お客さん対応"},{"id":"bat-06","category":"バッテリー","type":"おすすめ","question":"お客さま「iPhoneの背面にマグネットで付けたい。とにかく薄いものがいい」。どれをすすめる？","choices":["Nano Power Bank (MagGo, Plus)","Nano Power Bank (5000mAh, MagGo, Slim)","MagGo Power Bank (10000mAh, Slim)","622 Magnetic Battery (MagGo)"],"answer_index":1,"explanation":"約8.6mmでいちばん薄い。10000mAhのSlimとPlusは約15mm、622は約13mm。「薄さ優先なら5000mAh、容量優先なら10000mAh」と比べて案内する。","product":"Anker Nano Power Bank (5000mAh, MagGo, Slim)","image":"images/nano-power-bank-5000mah-maggo-slim.jpg","kind":"お客さん対応"},{"id":"bat-07","category":"バッテリー","type":"数字","question":"「Nano Power Bank (5000mAh, MagGo, Slim)」の厚さは？","choices":["約8.6mm","約13mm","約25mm","約15mm"],"answer_index":0,"explanation":"約8.6mmの超薄型で、付けたままでもスマホを操作しやすい。5000mAhなのでスマホ約1回分とあわせて伝える。","product":"Anker Nano Power Bank (5000mAh, MagGo, Slim)","image":"images/nano-power-bank-5000mah-maggo-slim.jpg","kind":"商品知識"},{"id":"bat-08","category":"バッテリー","type":"おすすめ","question":"お客さま「マグネットで付くバッテリーで、スマホを立てて動画も見たい」。どれをすすめる？","choices":["622 Magnetic Battery (MagGo)","Power Bank (10000mAh, 22.5W, 2 Ports)","Nano Power Bank (5000mAh, MagGo, Slim)","MagGo Power Bank (10000mAh, Slim)"],"answer_index":0,"explanation":"折りたたみ式のスタンドが付いたマグネット式バッテリー。移動中や机の上で動画を見るお客さまに向く。","product":"Anker 622 Mag nswer_index":3,"explanation":"220Wは合計の最大出力。USB-C 1ポートでは最大140W、USB-Aは最大22.5W。","product":"Anker Prime Power Bank (20100mAh, 220W)","image":"images/prime-power-bank-20100mah-220w.png","kind":"商品知識"},{"id":"bat-k26","category":"バッテリー","type":"知識","question":"お客さま「Prime Power Bank (20100mAh, 220W)は飛行機に持ち込める？」。正しい案内は？","choices":["国内線なら持ち込めるが、国際線には持ち込めない","機内に持ち込めるのは、残量が空のときだけ","機内には持ち込めないので、必ず預け荷物に入れる","機内に持ち込めるが、航空会社の規定は確認が必要"],"answer_index":3,"explanation":"機内持ち込み可。ただし航空会社の規定は要確認なので、利用する航空会社のルールを見てもらう。","product":"Anker Prime Power Bank (20100mAh, 220W)","image":"images/prime-power-bank-20100mah-220w.png","kind":"商品知識"},{"id":"bat-m01","category":"バッテリー","type":"おすすめ","question":"お客さま「iPhoneにマグネットで付けて、ワイヤレスで充電したい。1回分では足りないので、約2回分ほしい」。すすめられる商品を2つ選ぼう。","choices":["622 Magnetic Battery (MagGo)","Nano Power Bank (MagGo, Plus)","MagGo Power Bank (10000mAh, Slim)","Nano Power Bank (5000mAh, MagGo, Slim)"],"answer_indexes":[1,2],"explanation":"どちらも10000mAh（スマホ約2回）、ワイヤレス最大15W（Qi2）、厚さ約15mm。Plusはネオリチウムイオンバッテリーを採用し、アプリで状態を確認できる。ほかの2つは5000mAhで約1回分。","product":"Anker Nano Power Bank (MagGo, Plus)","image":"images/nano-power-bank-maggo-plus.jpg","kind":"お客さん対応","group":"10000mAhのMagGo（Qi2 15W）","products":[{"name":"Anker Nano Power Bank (MagGo, Plus)","image":"images/nano-power-bank-maggo-plus.jpg"},{"name":"Anker MagGo Power Bank (10000mAh, Slim)","image":"images/maggo-power-bank-10000mah-slim.jpg"}],"group_members":["Anker Nano Power Bank (MagGo, Plus)","Anker MagGo Power Bank (10000mAh, Slim)"]},{"id":"bat-m02","category":"バッテリー","type":"おすすめ","question":"お客さま「スマホ用に、10000mAhくらいのバッテリーがほしい。USB-CのケーブルもUSB-Aのケーブルも挿せるのがいい」。すすめられる商品を2つ選ぼう。","choices":["Nano Power Bank (22.5W, Built-in USB-C Connector)","Power Bank (20000mAh, 30W)","Power Bank (10000mAh, 22.5W, 2 Ports)","Power Bank (10000mAh, 22.5W)"],"answer_indexes":[2,3],"explanation":"どちらも10000mAh・最大22.5Wで、USB-CとUSB-Aのポートがある。3ポートで薄いのが (10000mAh, 22.5W)、残量ディスプレイ付きなのが2 Ports。ほかの2つは20000mAhと5000mAh。","product":"Anker Power Bank (10000mAh, 22.5W)","image":"images/power-bank-10000mah-22-5w.jpg","kind":"お客さん対応","group":"10000mAh・22.5Wの標準モデル","products":[{"name":"Anker Power Bank (10000mAh, 22.5W)","image":"images/power-bank-10000mah-22-5w.jpg"},{"name":"Anker Power Bank (10000mAh, 22.5W, 2 Ports)","image":"images/power-bank-10000mah-22-5w-2-ports.jpg"}],"group_members":["Anker Power Bank (10000mAh, 22.5W)","Anker Power Bank (10000mAh, 22.5W, 2 Ports)"]},{"id":"bat-m03","category":"バッテリー","type":"おすすめ","question":"お客さま「スマホを約4回充電できる大容量がいい。USB-Cケーブルは本体と一体のものがほしい」。すすめられる商品を2つ選ぼう。","choices":["Zolo Power Bank (20000mAh, 22.5W, Built-in USB-Cケーブル)","Zolo Power Bank (20000mAh, 30W, Built-in USB-Cケーブル)","Power Bank (20000mAh, 30W)","Zolo Power Bank (10000mAh, 22.5W, Built-in USB-Cケーブル)"],"answer_indexes":[0,1],"explanation":"どちらも20000mAhでUSB-Cケーブル一体型、入力は最大20W。違いは出力で、22.5Wと30W。10000mAhのZoloは約2回分、Power Bank (20000mAh, 30W) はケーブル一体型ではなく、ストラップになるケーブルが付属する。","product":"Anker Zolo Power Bank (20000mAh, 22.5W, Built-In USB-Cケーブル)","image":"images/zolo-power-bank-20000mah-22-5w-built-in-usb-c.jpg","kind":"お客さん対応","group":"20000mAhのUSB-Cケーブル一体型（スマホ向け）","products":[{"name":"Anker Zolo Power Bank (20000mAh, 22.5W, Built-In USB-Cケーブル)","image":"images/zolo-power-bank-20000mah-22-5w-built-in-usb-c.jpg"},{"name":"Anker Zolo Power Bank (20000mAh, 30W, Built-In USB-Cケーブル)","image":"images/zolo-power-bank-20000mah-30w-built-in-usb-c.jpg"}],"group_members":["Anker Zolo Power Bank (20000mAh, 22.5W, Built-In USB-Cケーブル)","Anker Zolo Power Bank (20000mAh, 30W, Built-In USB-Cケーブル)"]},{"id":"ear-01","category":"イヤホン・ヘッドホン","type":"おすすめ","question":"お客さま「会議や打ち合わせが多いので、AIボイスレコーダーも使えるイヤホンがほしい」。どれをすすめる？","choices":["Liberty 5","Liberty 5 Pro","Liberty 5 Pro Max","Liberty 4 Pro"],"answer_index":2,"explanation":"店頭の比較表7機種の中でAIボイスレコーダー機能が○なのはLiberty 5 Pro Maxだけ。充電ケースで対面の会話を録音できる。Liberty 5 Proとの大きな違い。","product":"Soundcore Liberty 5 Pro Max","image":"images/soundcore-liberty-5-pro-max.png","kind":"お客さん対応"},{"id":"ear-02","category":"イヤホン・ヘッドホン","type":"比較","question":"この中で、ウルトラノイズキャンセリングが「4.0」なのは？","choices":["Liberty 5","P42i","Liberty 5 Pro","Liberty 4 Pro"],"answer_index":2,"explanation":"Liberty 5 Proは4.0（Pro Maxも同じ）。Liberty 4 Pro・Liberty 5・P42iは3.5。静かさを最優先するお客さまへの説明に使う。","product":"Soundcore Liberty 5 Pro","image":"images/soundcore-liberty-5-pro.png","kind":"比較"},{"id":"ear-03","category":"イヤホン・ヘッドホン","type":"数字","question":"P42iの再生時間は、充電ケース使用時で最大何時間？（ノイズキャンセリングON）","choices":["40時間","30時間","28時間","32時間"],"answer_index":0,"explanation":"最大40時間で、Liberty / P比較表の7機種で最長。「充電の回数を減らしたい」というお客さまにすすめやすい。","product":"Soundcore P42i","image":"images/soundcore-p42i.jpg","kind":"商品知識"},{"id":"ear-04","category":"イヤホン・ヘッドホン","type":"比較","question":"この中で、LDACに対応していないのは？","choices":["Liberty Buds","Liberty 5","P30i","P42i"],"answer_index":2,"explanation":"P30iの対応コーデックはSBC / AACだけ。比較表の7機種でLDACがないのはP30iのみ。高音質のLDACで聴きたいお客さまにはP42i以上を案内する。","product":"Soundcore P30i","image":"images/soundcore-p30i.jpg","kind":"比較"},{"id":"ear-05","category":"イヤホン・ヘッドホン","type":"比較","question":"この中で、充電ケースのワイヤレス充電に対応しているのは？","choices":["Liberty Buds","AeroFit 2","C50i","AeroClip"],"answer_index":1,"explanation":"AeroFit 2は対応、AeroClip・C50i・Liberty Budsは非対応。ワイヤレス充電器を使っているお客さまへの確認ポイント。","product":"Soundcore AeroFit 2","image":"images/soundcore-aerofit-2.jpg","kind":"比較"},{"id":"ear-06","category":"イヤホン・ヘッドホン","type":"数字","question":"AeroFit 2の再生時間は、イヤホン本体のみで最大何時間？","choices":["14時間","7時間","8時間","10時間"],"answer_index":3,"explanation":"本体のみで最大10時間、充電ケース使用時で最大42時間。長時間つけっぱなしで使いたいお客さまに伝えられる数字。","product":"Soundcore AeroFit 2","image":"images/soundcore-aerofit-2.jpg","kind":"商品知識"},{"id":"ear-07","category":"イヤホン・ヘッドホン","type":"比較","question":"この中で、充電ケースにディスプレイが付いているのは？","choices":["P42i","Liberty Buds","Liberty 5","Liberty 4 Pro"],"answer_index":3,"explanation":"ディスプレイ搭載はLiberty 5 Pro Max・Liberty 5 Pro・Liberty 4 Proの3機種。画面のタッチ操作に対応するのは5 Pro Maxと5 Pro。","product":"Soundcore Liberty 4 Pro","image":"images/soundcore-liberty-4-pro.jpg","kind":"比較"},{"id":"ear-08","category":"イヤホン・ヘッドホン","type":"おすすめ","question":"お客さま「耳に掛けるタイプのオープンイヤーがほしい。角度を調整できると助かる」。どれをすすめる？","choices":["AeroClip","C50i","AeroFit 2","Liberty 5"],"answer_index":2,"explanation":"AeroFit 2は耳に掛けるイヤーフック型で、4段階の角度調整ができる。AeroClipとC50iは耳に挟むイヤーカフ型。","product":"Soundcore AeroFit 2","image":"images/soundcore-aerofit-2.jpg","kind":"お客さん対応"},{"id":"ear-09","category":"イヤホン・ヘッドホン","type":"おすすめ","question":"お客さま「耳に挟むイヤーカフ型がいい。外でよく使うので、防塵・防水の規格がいちばん高いものを」。どれをすすめる？","choices":["AeroClip","AeroFit 2","C50i","AeroClip 2"],"answer_index":3,"explanation":"AeroClip 2はイヤーカフ型でIP57（本体のみ）。AeroClipとC50iはIP55、AeroFit 2は耳に掛けるイヤーフック型。店頭の比較表ではAeroClipがIPX4表記だが、公式はIP55。","product":"Anker AeroClip 2","image":"images/aeroclip-2.png","kind":"お客さん対応"},{"id":"ear-10","category":"イヤホン・ヘッドホン","type":"数字","question":"AeroClipの再生時間は、充電ケース使用時で最大何時間？","choices":["21時間","32時間","46時間","28時間"],"answer_index":1,"explanation":"充電ケース使用時で最大32時間、本体のみで最大8時間。イヤーカフ型のC50iは28時間 / 7時間なので、比べて案内できる。","product":"Soundcore AeroClip","image":"images/soundcore-aeroclip.jpg","kind":"商品知識"},{"id":"ear-11","category":"イヤホン・ヘッドホン","type":"知識","question":"「Liberty Buds」はどんなイヤホン？","choices":["AIボイスレコーダー搭載のビジネス向けモデル","耳に挟むイヤーカフ型のオープンイヤー","耳に掛けるイヤーフック型のオープンイヤー","軽いつけ心地のインナーイヤー型で、ノイズキャンセリングも使える"],"answer_index":3,"explanation":"インナーイヤー型で、アクティブノイズキャンセリングも備える。耳栓のような密閉感が苦手だが静かに聴きたい、というお客さまに。","product":"Soundcore Liberty Buds","image":"images/soundcore-liberty-buds.jpg","kind":"商品知識"},{"id":"ear-12","category":"イヤホン・ヘッドホン","type":"比較","question":"Liberty Budsにはなくて、Liberty Buds 2にあるものは？","choices":["IP55の防塵・防水","LDAC対応","ワイヤレス充電","ノイズキャンセリング"],"answer_index":2,"explanation":"Liberty Buds 2はワイヤレス充電に対応。ノイズキャンセリングも「ウルトラ 4.0」に進化している。ほかの3つはLiberty Budsにもある。","product":"Anker Liberty Buds 2","image":"images/liberty-buds-2.png","kind":"比較"},{"id":"ear-13","category":"イヤホン・ヘッドホン","type":"数字","question":"Liberty 4 Proは、約5分の充電で最大何時間使える？","choices":["4時間","2時間","3.5時間","5時間"],"answer_index":0,"explanation":"約5分の充電で最大4時間（ノイズキャンセリングOFF時）。出かける直前に少しだけ充電したいお客さまに伝えられる。","product":"Soundcore Liberty 4 Pro","image":"images/soundcore-liberty-4-pro.jpg","kind":"商品知識"},{"id":"ear-14","category":"イヤホン・ヘッドホン","type":"数字","question":"Liberty 5の再生時間は、イヤホン本体のみで最大何時間？（ノイズキャンセリングON）","choices":["10時間","5時間","8時間","6時間"],"answer_index":2,"explanation":"本体のみで最大8時間、充電ケース使用時で最大32時間。約10分の充電で最大5時間使える点もあわせて案内できる。","product":"Soundcore Liberty 5","image":"images/soundcore-liberty-5.jpg","kind":"商品知識"},{"id":"ear-15","category":"イヤホン・ヘッドホン","type":"比較","question":"店頭の比較表で、3Dオーディオの欄に「Dolby Audio」と書かれているのは？","choices":["Liberty Buds","Liberty 4 Pro","Liberty 5","P42i"],"answer_index":2,"explanation":"Dolby AudioはLiberty 5。Liberty 5 Pro Maxと5 ProはDolby Atmos、ほかの機種は「3Dオーディオ」の表記。","product":"Soundcore Liberty 5","image":"images/soundcore-liberty-5.jpg","kind":"比較"},{"id":"ear-16","category":"イヤホン・ヘッドホン","type":"比較","question":"店頭の比較表で、マルチポイント接続が「3台対応」と書かれているのは？","choices":["Liberty 4 Pro","P42i","Liberty 5","Liberty 5 Pro"],"answer_index":3,"explanation":"3台対応の記載があるのはLiberty 5 Pro Maxと5 Pro。スマホ・PC・タブレットを行き来するお客さまに案内できる。","product":"Soundcore Liberty 5 Pro","image":"images/soundcore-liberty-5-pro.png","kind":"比較"},{"id":"ear-17","category":"イヤホン・ヘッドホン","type":"比較","question":"店頭の比較表で、充電ケースが「マグネット式」のワイヤレス充電に対応しているのは？","choices":["Liberty 5","P42i","Liberty 5 Pro Max","Liberty 5 Pro"],"answer_index":2,"explanation":"マグネット式に対応と書かれているのはLiberty 5 Pro Maxだけ。5 Proもワイヤレス充電はできるが、マグネット式には対応しない。","product":"Soundcore Liberty 5 Pro Max","image":"images/soundcore-liberty-5-pro-max.png","kind":"比較"},{"id":"ear-19","category":"イヤホン・ヘッドホン","type":"おすすめ","question":"お客さま「ランニングやジムで使う。外れにくくて、防水がしっかりしたイヤホンがいい」。どれをすすめる？","choices":["Sport X20","Liberty 5","P30i","Liberty Buds"],"answer_index":0,"explanation":"伸縮・角度調整ができるイヤーフック付きで、防塵防水はIP68。ノイズキャンセリングとマルチポイントにも対応する。","product":"Soundcore Sport X20","image":"images/soundcore-sport-x20.jpg","kind":"お客さん対応"},{"id":"ear-20","category":"イヤホン・ヘッドホン","type":"比較","question":"この中で、防塵・防水の規格がいちばん高い「IP68」のイヤホンは？","choices":["K20i","P30i","Sport X20","P42i"],"answer_index":2,"explanation":"Sport X20はIP68。P42iはIP55、P30iはIP54、K20iはIPX5。スポーツ用途のお客さまには規格もあわせて説明する。","product":"Soundcore Sport X20","image":"images/soundcore-sport-x20.jpg","kind":"比較"},{"id":"ear-21","category":"イヤホン・ヘッドホン","type":"おすすめ","question":"お客さま「通勤中、イヤホンのケースにスマホを立てて動画を見たい」。どれをすすめる？","choices":["K20i","Liberty Buds","Liberty 5","P30i"],"answer_index":3,"explanation":"P30iは充電ケースがスマホスタンドになる。ノイズキャンセリングも付いたエントリーモデルとして案内できる。","product":"Soundcore P30i","image":"images/soundcore-p30i.jpg","kind":"お客さん対応"},{"id":"ear-22","category":"イヤホン・ヘッドホン","type":"知識","question":"「K20i」はどんなイヤホン？","choices":["ケースに画面が付いたノイズキャンセリングモデル","耳に挟むイヤーカフ型のオープンイヤー","軽いインナーイヤー型で、ケース込み最大36時間使える","ワイヤレス充電に対応したプロモデル"],"answer_index":2,"explanation":"片耳約3.3gのインナーイヤー型。本体のみ最大6時間、ケース込み最大36時間。軽さを重視するお客さまに。","product":"Soundcore K20i","image":"images/soundcore-k20i.jpg","kind":"商品知識"},{"id":"ear-23","category":"イヤホン・ヘッドホン","type":"知識","question":"この中で「ヘッドホン」はどれ？","choices":["Liberty Buds 2","Space 2","AeroClip 2","AeroFit 2"],"answer_index":1,"explanation":"Spaceシリーズはヘッドホン、Aero系とLiberty系はイヤホン。「2」が付く商品が多いので、シリーズ名まで聞いて確認する。","product":"Soundcore Space 2","image":"images/soundcore-space-2.jpg","kind":"商品知識"},{"id":"ear-24","category":"イヤホン・ヘッドホン","type":"比較","question":"この中で、ノイズキャンセリングが最も新しい世代の「4.0」のヘッドホンは？","choices":["Space One Pro","Q31i","Space 2 Pro","Space 2"],"answer_index":2,"explanation":"Space 2 Proはウルトラノイズキャンセリング4.0（AIチップ「Thus」）。Space One ProとSpace 2は3.5、Q31iは3.0。","product":"Anker Space 2 Pro","image":"images/space-2-pro.jpg","kind":"比較"},{"id":"ear-25","category":"イヤホン・ヘッドホン","type":"比較","question":"この中で、ノイズキャンセリングONの再生時間がいちばん長いヘッドホンは？","choices":["Space One Pro","Space One","Space 2 Pro","Space 2"],"answer_index":3,"explanation":"Space 2はNC ONで最大50時間。Space One ProとSpace Oneは40時間、Space 2 Proは30時間。「Pro」が必ずしも長持ちではない点に注意。","product":"Soundcore Space 2","image":"images/soundcore-space-2.jpg","kind":"比較"},{"id":"ear-26","category":"イヤホン・ヘッドホン","type":"比較","question":"Q31iにあって、Q30iにはないものは？","choices":["40mmドライバー","最大80時間の再生","LDAC対応","ノイズキャンセリング"],"answer_index":2,"explanation":"Q31iはLDAC対応、Q30iはSBC / AAC。再生時間（最大80時間）と40mmドライバー、ノイズキャンセリングは両方にある。","product":"Anker Soundcore Q31i","image":"images/q31i.png","kind":"比較"},{"id":"ear-27","category":"イヤホン・ヘッドホン","type":"数字","question":"Q31iは、ノイズキャンセリングONで最大何時間使える？","choices":["40時間","80時間","30時間","50時間"],"answer_index":3,"explanation":"NC ONで最大50時間、OFFなら最大80時間。10分の充電で最大10時間使える点も伝えられる。","product":"Anker Soundcore Q31i","image":"images/q31i.png","kind":"商品知識"},{"id":"ear-28","category":"イヤホン・ヘッドホン","type":"比較","question":"店頭のオープンイヤー比較表で、全8機種に共通しているのは？","choices":["ワイヤレス充電に対応","LDACに対応","4段階の角度調整ができる","対話翻訳とAIアシスタントに対応"],"answer_index":3,"explanation":"対話翻訳とAIアシスタントは全機種○。使うにはSoundcoreアプリ（無料）のダウンロードとログインが必要なことも案内する。","product":"Soundcore AeroFit 2","image":"images/soundcore-aerofit-2.jpg","kind":"比較"},{"id":"ear-29","category":"イヤホン・ヘッドホン","type":"知識","question":"オープンイヤーイヤホンの翻訳やAIアシスタントを使うには、どのアプリが必要？","choices":["eufyアプリ","Nebulaアプリ","Ankerアプリ","Soundcoreアプリ"],"answer_index":3,"explanation":"AI機能にはSoundcoreアプリ（無料）のダウンロードとログインが必要。購入時にひとこと伝えると、使い始めで迷わせない。","product":"Soundcore AeroFit 2","image":"images/soundcore-aerofit-2.jpg","kind":"使い方"},{"id":"ear-30","category":"イヤホン・ヘッドホン","type":"知識","question":"お客さま「iPhoneで、LDACの高音質で聴きたい」。正しい案内は？","choices":["Soundcoreアプリを入れればiPhoneでも使える","イヤホンをリセットすればiPhoneでも使える","マルチポイントをオンにすればiPhoneでも使える","LDACは対応するAndroid端末で使う機能で、iPhoneは非対応"],"answer_index":3,"explanation":"LDACを使えるのは対応するAndroid端末だけ。iPhoneのお客さまには、LDAC以外の特徴（ノイズキャンセリングや再生時間など）で機種を案内する。","product":"Soundcore Space One Pro","image":"images/soundcore-space-one-pro.jpg","kind":"使い方"},{"id":"ear-31","category":"イヤホン・ヘッドホン","type":"知識","question":"Soundcoreアプリの「HearID」でできることは？","choices":["聴こえ方に合わせた自分専用のイコライザーを作る","イヤホンの充電時間を短くする","2台のスピーカーを左右に分ける","イヤホンを紛失したときに場所を探す"],"answer_index":0,"explanation":"Liberty 5 Proでは、短い聴力テストから自分用のイコライザーを作れる。「音の好みが合わない」というお客さまに、アプリで調整できると伝える。","product":"Soundcore Liberty 5 Pro","image":"images/soundcore-liberty-5-pro.png","kind":"使い方"},{"id":"ear-32","category":"イヤホン・ヘッドホン","type":"知識","question":"Space 2の電源を入れたが、つながらないまま待機状態になった。もう一度ペアリングモードにするには？","choices":["電源ボタンを2回押す","充電ケーブルを挿す","スマホを再起動する","音量＋ボタンを1回押す"],"answer_index":0,"explanation":"Space 2は2分以内につながらないと待機状態になる。電源ボタンを2回押すと、再びペアリングモードに入る。","product":"Soundcore Space 2","image":"images/soundcore-space-2.jpg","kind":"使い方"},{"id":"ear-33","category":"イヤホン・ヘッドホン","type":"知識","question":"Space Oneをリセットするとき、電源オンの状態で5秒長押しするボタンは？","choices":["電源ボタンだけ","音量＋ボタンと音量−ボタン","電源ボタンと音量＋ボタン","電源ボタンと音量−ボタン"],"answer_index":2,"explanation":"電源ボタンと音量＋ボタンを同時に5秒長押しし、赤が3回点滅したら完了。「つながらない」という相談で最初に案内できる操作。","product":"Soundcore Space One","image":"images/soundcore-space-one.jpg","kind":"使い方"},{"id":"ear-34","category":"イヤホン・ヘッドホン","type":"知識","question":"Space Oneを2台の機器に同時接続している。音はどう切り替わる？","choices":["必ずスマホの音が優先される","最後に再生した機器へ自動で切り替わる","先に再生した機器が優先され、2台目は割り込めない","2台の音が混ざって聞こえる"],"answer_index":2,"explanation":"Space Oneは先に再生した機器が優先。「切り替わらない」と言われたら、先の機器の再生を止めてもらう。Space One Proは最後に再生した機器に切り替わる。","product":"Soundcore Space One","image":"images/soundcore-space-one.jpg","kind":"使い方"},{"id":"ear-35","category":"イヤホン・ヘッドホン","type":"手順","question":"最新版のSoundcoreアプリを入れたあと、Liberty 5をアプリに登録する手順を、正しい順に並べよう","choices":["イヤホンをスマホとペアリングする","アプリを開き、左下のグリッドアイコンをタップする","My Devices の画面に入る","Add Device をタップする（自動で接続される）","つながらないときだけ、Set Up Manually から機種を選ぶ"],"answer_index":0,"explanation":"先にスマホとBluetoothでつなぎ、それからアプリに追加する。初回は位置情報の許可が必要。アプリはパソコンには対応しない。Liberty Budsも同じ流れ。※アプリのメニュー名は公式サポート（英語）の表記。日本語アプリでは表示が異なる場合がある。","product":"Soundcore Liberty 5","image":"images/soundcore-liberty-5.jpg","kind":"使い方"},{"id":"ear-36","category":"イヤホン・ヘッドホン","type":"手順","question":"Liberty 5 Pro Maxの「充電ケース」をアプリに登録する手順を、正しい順に並べよう","choices":["イヤホンをスマホとペアリングする","アプリの Add Device からイヤホンの画面に入る","1つ前のページに戻り、充電ケースのカードを表示する","カードの Go to Pair からスマホのBluetooth設定を開く","「Liberty 5 Pro Max Box」を選び、スマホとケースの両方で確認する","アプリでケースの接続を確認する"],"answer_index":0,"explanation":"Liberty 5 Pro Maxだけの追加手順。イヤホンとは別に、ケースも「Liberty 5 Pro Max Box」としてつなぐのがポイント。※アプリのメニュー名は公式サポート（英語）の表記。日本語アプリでは表示が異なる場合がある。","product":"Soundcore Liberty 5 Pro Max","image":"images/soundcore-liberty-5-pro-max.png","kind":"使い方"},{"id":"ear-37","category":"イヤホン・ヘッドホン","type":"手順","question":"ヘッドホンのSpace 2を、初めてスマホとつなぐ手順を、正しい順に並べよう","choices":["初めて電源を入れる","青ランプが速く点滅し、自動でペアリングモードに入ったのを確認する","スマホのBluetooth画面から選んで接続する","青ランプが点き、3秒で消えたら接続完了"],"answer_index":0,"explanation":"初回は電源を入れるだけでペアリングモードに入る。2分以内につながらないと待機状態になるので、その場合は電源ボタンを2回押す。","product":"Soundcore Space 2","image":"images/soundcore-space-2.jpg","kind":"使い方"},{"id":"ear-38","category":"イヤホン・ヘッドホン","type":"手順","question":"Space Oneを2台の機器に同時につなぐ（マルチポイント）手順を、正しい順に並べよう","choices":["1台目の機器とつながった状態にする","ヘッドホンの電源ボタンを2回押す","2台目の機器のBluetooth画面から接続する"],"answer_index":0,"explanation":"Space 2も同じ手順。マルチポイントは初期状態でオンなので、電源ボタンの2回押しを覚えておけば案内できる。","product":"Soundcore Space One","image":"images/soundcore-space-one.jpg","kind":"使い方"},{"id":"ear-39","category":"イヤホン・ヘッドホン","type":"手順","question":"Sport X20で、2台接続（マルチポイント）をアプリから設定する手順を、正しい順に並べよう","choices":["1台目の機器とつながった状態にする","アプリ右上の設定を開く","More Settings を選ぶ","Dual Connections を選ぶ"],"answer_index":0,"explanation":"Space One / Space 2は本体の電源ボタン2回押しだが、Sport X20はアプリから設定する。機種で方法が違う点に注意。※アプリのメニュー名は公式サポート（英語）の表記。日本語アプリでは表示が異なる場合がある。","product":"Soundcore Sport X20","image":"images/soundcore-sport-x20.jpg","kind":"使い方"},{"id":"ear-40","category":"イヤホン・ヘッドホン","type":"手順","question":"Q31iで、SoundcoreアプリのカスタムEQ（イコライザー）を作る手順を、正しい順に並べよう","choices":["Soundcoreアプリにサインインする","HearID を開く","Create でカスタムEQを作る","自分のプロファイルとして保存する"],"answer_index":0,"explanation":"作ったEQは音楽や動画などの再生音だけに効き、通話の音声には効かない。※アプリのメニュー名は公式サポート（英語）の表記。日本語アプリでは表示が異なる場合がある。","product":"Anker Soundcore Q31i","image":"images/q31i.png","kind":"使い方"},{"id":"ear-41","category":"イヤホン・ヘッドホン","type":"手順","question":"Liberty 5 ProでLDACを使えるようにする手順を、正しい順に並べよう（対応Android端末）","choices":["アプリの More Setting e 2 Pro」はどんなヘッドホン？","choices":["コーデックがSBCとAACだけで、LDACには対応しないモデル","Bluetoothを使わない、有線接続専用のスタジオ向けモデル","ノイズキャンセリングを省いて、軽さを重視したエントリーモデル","AIチップ「Thus」を使ったウルトラノイズキャンセリング 4.0のモデル"],"answer_index":3,"explanation":"ウルトラノイズキャンセリング 4.0（AIチップ「Thus」）。コーデックはSBC / AAC / LDAC。","product":"Anker Space 2 Pro","image":"images/space-2-pro.jpg","kind":"商品知識"},{"id":"ear-k06","category":"イヤホン・ヘッドホン","type":"知識","question":"「Space 2 Pro」の機能として正しいのは？","choices":["充電ケースにディスプレイがある","防水なのでプールで使える","装着検出に対応している","AIで会話を録音できる"],"answer_index":2,"explanation":"装着検出に対応し、2台のマルチポイントも使える。マイクは6つ。","product":"Anker Space 2 Pro","image":"images/space-2-pro.jpg","kind":"商品知識"},{"id":"ear-k07","category":"イヤホン・ヘッドホン","type":"知識","question":"「Q30i」でハイレゾ音源を楽しめるのは？","choices":["AUXでつないだとき","Bluetoothでつないだとき","2台同時につないだとき","LDACでつないだとき"],"answer_index":0,"explanation":"ハイレゾはAUX接続時のみ。Bluetoothのコーデックは SBC / AAC。","product":"Soundcore Q30i","image":"images/soundcore-q30i.png","kind":"商品知識"},{"id":"ear-k08","category":"イヤホン・ヘッドホン","type":"数字","question":"「Q30i」の再生時間は最大何時間？（ノイズキャンセリングを使わない場合）","choices":["55時間","24時間","40時間","80時間"],"answer_index":3,"explanation":"最大80時間。ノイズキャンセリングONでも最大50時間使える。","product":"Soundcore Q30i","image":"images/soundcore-q30i.png","kind":"商品知識"},{"id":"ear-k09","category":"イヤホン・ヘッドホン","type":"知識","question":"「AeroClip 2」はどんなイヤホン？","choices":["頭にかぶるヘッドホン","ケースがスマホスタンドになるノイズキャンセリングモデル","耳に掛けるイヤーフック型のオープンイヤー","耳に挟むイヤーカフ型のオープンイヤー"],"answer_index":3,"explanation":"オープンイヤー（イヤーカフ型）。防塵防水はIP57（本体のみ）で、LDACに対応する。","product":"Anker AeroClip 2","image":"images/aeroclip-2.png","kind":"商品知識"},{"id":"ear-k10","category":"イヤホン・ヘッドホン","type":"数字","question":"「AeroClip 2」の再生時間は、充電ケース使用時で最大何時間？","choices":["32時間","20時間","8時間","50時間"],"answer_index":0,"explanation":"本体のみで最大8時間、ケース込みで最大32時間。","product":"Anker AeroClip 2","image":"images/aeroclip-2.png","kind":"商品知識"},{"id":"ear-k11","category":"イヤホン・ヘッドホン","type":"知識","question":"「Liberty Buds 2」のノイズキャンセリングは？","choices":["ノイズキャンセリングはない","ウルトラノイズキャンセリング 4.0（Thus搭載）","ウルトラノイズキャンセリング 3.5","ウルトラノイズキャンセリング 3.0"],"answer_index":1,"explanation":"ウルトラノイズキャンセリング 4.0（Thus搭載）。ノイズキャンセリングONでケース込み最大27時間使える。","product":"Anker Liberty Buds 2","image":"images/liberty-buds-2.png","kind":"商品知識"},{"id":"ear-k12","category":"イヤホン・ヘッドホン","type":"知識","question":"「Liberty Buds 2」のマイクは？","choices":["6マイク＋骨伝導センサー","マイクなし（通話は不可）","2マイク（センサーなし）","8マイク＋骨伝導センサー"],"answer_index":0,"explanation":"6マイク＋骨伝導センサー。通話でも使いたい方への説明に使える。","product":"Anker Liberty Buds 2","image":"images/liberty-buds-2.png","kind":"商品知識"},{"id":"ear-k13","category":"イヤホン・ヘッドホン","type":"知識","question":"「Liberty 5 Pro」の充電ケースの特徴は？","choices":["ふたを開けるとスマホスタンドになる","ソーラーパネルが付いていて、日光で充電できる","タッチ操作できるディスプレイが付いている","AIボイスレコーダーで対面の会話を録音できる"],"answer_index":2,"explanation":"ケースにタッチ操作できるディスプレイがある。ワイヤレス充電にも対応する（マグネットは不可）。","product":"Soundcore Liberty 5 Pro","image":"images/soundcore-liberty-5-pro.png","kind":"商品知識"},{"id":"ear-k14","category":"イヤホン・ヘッドホン","type":"知識","question":"「Liberty 5 Pro」の立体音響は？","choices":["DTS:X","Dolby Audio","対応していない","Dolby Atmos"],"answer_index":3,"explanation":"Dolby Atmosに対応。ドライバーは9.2mmダイナミック。","product":"Soundcore Liberty 5 Pro","image":"images/soundcore-liberty-5-pro.png","kind":"商品知識"},{"id":"ear-k15","category":"イヤホン・ヘッドホン","type":"知識","question":"「Liberty 5 Pro Max」の充電ケースでできることは？","choices":["スマホを立てかける（スマホスタンド内蔵）","スマホをワイヤレス充電する（バッテリー内蔵）","イヤホンなしで音楽を流す（スピーカー内蔵）","対面の会話を録音する（AIボイスレコーダー）"],"answer_index":3,"explanation":"AIボイスレコーダーを搭載し、充電ケースで対面の会話を録音できる。","product":"Soundcore Liberty 5 Pro Max","image":"images/soundcore-liberty-5-pro-max.png","kind":"商品知識"},{"id":"ear-k16","category":"イヤホン・ヘッドホン","type":"数字","question":"「Liberty 5 Pro Max」のマルチポイントは何台まで？","choices":["2台","1台","3台","5台"],"answer_index":2,"explanation":"3台のマルチポイントに対応。店頭の比較表では、LDAC併用時は同時接続が2台までになる。","product":"Soundcore Liberty 5 Pro Max","image":"images/soundcore-liberty-5-pro-max.png","kind":"商品知識"},{"id":"ear-k17","category":"イヤホン・ヘッドホン","type":"知識","question":"「P30i」の充電ケースの特徴は？","choices":["ディスプレイが付いている","ワイヤレス充電に対応している","会話を録音できる","スマホスタンドになる"],"answer_index":3,"explanation":"ケースがスマホスタンドになる。ワイヤレス充電には対応していない。","product":"Soundcore P30i","image":"images/soundcore-p30i.jpg","kind":"商品知識"},{"id":"ear-k18","category":"イヤホン・ヘッドホン","type":"数字","question":"「P30i」の再生時間は、充電ケース使用時で最大何時間？（ノイズキャンセリングON）","choices":["7時間","50時間","30時間","20時間"],"answer_index":2,"explanation":"ノイズキャンセリングONで、本体最大7時間・ケース込み最大30時間。","product":"Soundcore P30i","image":"images/soundcore-p30i.jpg","kind":"商品知識"},{"id":"ear-k19","category":"イヤホン・ヘッドホン","type":"知識","question":"「Sport X20」の特徴は？","choices":["頭にかぶるヘッドホン型","伸縮・角度調整ができるイヤーフック付き","充電ケースにディスプレイが付いている","耳に挟むイヤーカフ型"],"answer_index":1,"explanation":"イヤーフックは伸縮・角度調整ができる。アクティブノイズキャンセリングを備え、防塵防水はIP68。","product":"Soundcore Sport X20","image":"images/soundcore-sport-x20.jpg","kind":"商品知識"},{"id":"ear-k20","category":"イヤホン・ヘッドホン","type":"数字","question":"「Sport X20」の再生時間は、イヤホン本体のみで最大何時間？（ノイズキャンセリングを使わない場合）","choices":["8時間","24時間","4時間","12時間"],"answer_index":3,"explanation":"本体最大12時間、ケース込み最大48時間。ノイズキャンセリングONでは7時間／28時間。","product":"Soundcore Sport X20","image":"images/soundcore-sport-x20.jpg","kind":"商品知識"},{"id":"ear-k21","category":"イヤホン・ヘッドホン","type":"知識","question":"「C50i」の本体の操作方法は？","choices":["ダイヤル","専用リモコン","タッチ","ボタン"],"answer_index":3,"explanation":"操作はボタン。耳に挟むイヤーカフ型で、片耳約5.5g。","product":"Soundcore C50i","image":"images/soundcore-c50i.png","kind":"商品知識"},{"id":"ear-k22","category":"イヤホン・ヘッドホン","type":"知識","question":"「C50i」はどんなイヤホン？","choices":["耳の穴をふさぐノイズキャンセリングモデル","耳に掛けるイヤーフック型","頭にかぶるヘッドホン","LDACに対応した、耳に挟むイヤーカフ型"],"answer_index":3,"explanation":"オープンイヤー（イヤーカフ型）で、SBC / AAC / LDACに対応。防塵防水はIP55。","product":"Soundcore C50i","image":"images/soundcore-c50i.png","kind":"商品知識"},{"id":"ear-m01","category":"イヤホン・ヘッドホン","type":"おすすめ","question":"お客さま「耳の穴をふさがずに、耳に挟むイヤーカフ型のイヤホンがほしい」。すすめられる商品を2つ選ぼう。","choices":["AeroClip","AeroFit 2","C50i","Liberty Buds"],"answer_indexes":[0,2],"explanation":"どちらもイヤーカフ型で、12mmドライバー・LDAC対応・IP55。再生時間はAeroClipが wer_indexes":[0,2],"explanation":"どちらも最大80時間（ノイズキャンセリングONで最大50時間）で、40mmドライバー。LDACを使いたいならQ31i。Space One ProとSpace 2 Proは最大60時間。","product":"Soundcore Q30i","image":"images/soundcore-q30i.png","kind":"お客さん対応","group":"最大80時間のQシリーズヘッドホン","products":[{"name":"Soundcore Q30i","image":"images/soundcore-q30i.png"},{"name":"Anker Soundcore Q31i","image":"images/q31i.png"}],"group_members":["Soundcore Q30i","Anker Soundcore Q31i"]},{"id":"ear-m05","category":"イヤホン・ヘッドホン","type":"おすすめ","question":"お客さま「LDACに対応したヘッドホンがいい。移動が長いので、ノイズキャンセリングONで40時間は使いたい」。すすめられる商品を2つ選ぼう。","choices":["Q30i","Space 2","Space One Pro","Space 2 Pro"],"answer_indexes":[1,2],"explanation":"どちらもウルトラノイズキャンセリング 3.5・40mmドライバー・LDAC対応。NC ONの再生時間はSpace One Proが最大40時間、Space 2が最大50時間。折りたたみたいならSpace One Pro。Q30iはLDAC非対応、Space 2 ProはNC ONで最大30時間。","product":"Soundcore Space One Pro","image":"images/soundcore-space-one-pro.jpg","kind":"お客さん対応","group":"ウルトラNC 3.5・LDAC対応のヘッドホン","products":[{"name":"Soundcore Space One Pro","image":"images/soundcore-space-one-pro.jpg"},{"name":"Soundcore Space 2","image":"images/soundcore-space-2.jpg"}],"group_members":["Soundcore Space One Pro","Soundcore Space 2"]},{"id":"neb-01","category":"Nebula","type":"比較","question":"この中で、いちばん明るい（ANSIルーメンが高い）プロジェクターは？","choices":["Nebula X1","Nebula P1","Cosmos 4K SE","Capsule 3 Laser"],"answer_index":0,"explanation":"X1は3500、Cosmos 4K SEは1800、P1は650、Capsule 3 Laserは300ANSIルーメン。明るい部屋で見たいお客さまほど、数字の大きい機種を案内する。","product":"Nebula X1","image":"images/nebula-x1.png","kind":"比較"},{"id":"neb-02","category":"Nebula","type":"数字","question":"Nebula X1が映せる画面サイズは最大何インチ？","choices":["180インチ","300インチ","200インチ","120インチ"],"answer_index":1,"explanation":"40〜300インチで、約2.0mの距離で100インチを映せる。設置場所の距離を聞いて案内する。","product":"Nebula X1","image":"images/nebula-x1.png","kind":"商品知識"},{"id":"neb-03","category":"Nebula","type":"おすすめ","question":"お客さま「4Kで、予算より明るさ優先。明るめのリビングでも大画面で見たい」。どれをすすめる？","choices":["Nebula X1","Cosmos 4K SE","Capsule 3","Nebula P1"],"answer_index":0,"explanation":"4Kで3500ANSIルーメンの3色レーザー。Cosmos 4K SEも4Kだが1800ANSIルーメン。P1とCapsule 3はフルHD。","product":"Nebula X1","image":"images/nebula-x1.png","kind":"お客さん対応"},{"id":"neb-04","category":"Nebula","type":"おすすめ","question":"お客さま「リビングに置いて、4Kで映画を楽しみたい」。どれをすすめる？","choices":["Cosmos 4K SE","Capsule 3","Nebula P1","Capsule 3 Laser"],"answer_index":0,"explanation":"選択肢の中で4KなのはCosmos 4K SEだけ。Dolby Visionにも対応する。ほかの3機種はフルHD。","product":"Nebula Cosmos 4K SE","image":"images/cosmos-4k-se.jpg","kind":"お客さん対応"},{"id":"neb-05","category":"Nebula","type":"おすすめ","question":"お客さま「キャンプに持って行きたい。電源のない場所でも映画を1本見られるプロジェクターがいい」。どれをすすめる？","choices":["Nebula P1","Cosmos 4K SE","Capsule 3 Laser","Nebula X1"],"answer_index":2,"explanation":"バッテリーを内蔵し、約2.5時間再生できる。重さも約950gと軽い。P1は持ち運びやすい形だが、プロジェクター本体にバッテリーはない。","product":"Nebula Capsule 3 Laser","image":"images/capsule-3-laser.jpg","kind":"お客さん対応"},{"id":"neb-06","category":"Nebula","type":"数字","question":"Capsule 3 Laserは、内蔵バッテリーで約何時間再生できる？","choices":["約8時間","約5時間","約2.5時間","約1時間"],"answer_index":2,"explanation":"約2.5時間なので、映画1本が目安。連続して使う予定のお客さまには、電源の用意もあわせて聞く。","product":"Nebula Capsule 3 Laser","image":"images/capsule-3-laser.jpg","kind":"商品知識"},{"id":"neb-07","category":"Nebula","type":"比較","question":"Capsule 3と比べて、Capsule 3 Laserが上回っているのは？","choices":["本体の軽さ","明るさ","最大画面サイズ","解像度"],"answer_index":1,"explanation":"Capsule 3 Laserは300、Capsule 3は200ANSIルーメン。解像度（フルHD）と最大120インチは同じで、重さはCapsule 3のほうが軽い（約850g / 約950g）。","product":"Nebula Capsule 3 Laser","image":"images/capsule-3-laser.jpg","kind":"比較"},{"id":"neb-08","category":"Nebula","type":"知識","question":"この中で、本体が円筒形（缶のような形）のプロジェクターは？","choices":["Nebula P1","Cosmos 4K SE","Capsule 3 Laser","Nebula X1"],"answer_index":2,"explanation":"Capsuleシリーズは円筒形。形を見て「Capsuleシリーズですね」とすぐ案内できるようにしておく。","product":"Nebula Capsule 3 Laser","image":"images/capsule-3-laser.jpg","kind":"商品知識"},{"id":"neb-09","category":"Nebula","type":"知識","question":"「Nebula P1」の特徴は？","choices":["着脱できるデュアルスピーカーが付いたフルHDモデル","3色レーザーを使った4Kの最上位モデル","4KでDolby Visionに対応した据え置きモデル","バッテリー内蔵で缶サイズのモデル"],"answer_index":0,"explanation":"スピーカーを外して離れた場所に置ける。フルHD・650ANSIルーメン・Google TV搭載。","product":"Soundcore Nebula P1","image":"images/nebula-p1.png","kind":"商品知識"},{"id":"neb-10","category":"Nebula","type":"知識","question":"お客さま「Nebula P1を庭で使いたい」。必ず伝えることは？","choices":["プロジェクター本体はバッテリー非搭載なので、電源が必要","スピーカーは別売りなので、買い足しが必要","天井や壁には向けられない","フルHDに対応していない"],"answer_index":0,"explanation":"スピーカー側はバッテリーで最大20時間再生できるが、プロジェクター本体には電源が必要。電源のない場所ならCapsule 3 Laserなどを案内する。","product":"Soundcore Nebula P1","image":"images/nebula-p1.png","kind":"商品知識"},{"id":"neb-11","category":"Nebula","type":"知識","question":"「公式プロジェクタージンバルスタンド（X1 / Cosmos Laser 4K / Cosmos 4K SE用）」に対応しているのは？","choices":["Capsule 3","Nebula P1","Nebula X1","Capsule 3 Laser"],"answer_index":2,"explanation":"対応機種は商品名のとおりX1・Cosmos Laser 4K・Cosmos 4K SE。Capsuleシリーズには別の「Capsuleシリーズ用」スタンドがある。","product":"Nebula 公式プロジェクタージンバルスタンド (X1 / Cosmos Laser 4K / Cosmos 4K SE用)","image":"images/projector-gimbal-stand-x1-cosmos.jpg","kind":"商品知識"},{"id":"neb-12","category":"Nebula","type":"おすすめ","question":"お客さま「Capsule 3 Laserを持っている。専用のジンバルスタンドがほしい」。どれをすすめる？","choices":["MagGo Wireless Charger (Stand)","公式プロジェクタージンバルスタンド (Capsuleシリーズ用)","公式プロジェクタージンバルスタンド (X1 / Cosmos Laser 4K / Cosmos 4K SE用)","Prime Charging Base"],"answer_index":1,"explanation":"Capsuleシリーズ用の公式スタンド。水平360°に回せて、天井への投影もできる。ジンバルスタンドは2種類あるので、先に機種名を確認する。","product":"Nebula 公式プロジェクタージンバルスタンド (Capsuleシリーズ用)","image":"images/capsule-gimbal-stand.jpg","kind":"お客さん対応"},{"id":"neb-13","category":"Nebula","type":"知識","question":"お客さま「ゲーム機をNebula X1につなぎたい」。本体背面にある映像端子は？","choices":["HDMI","VGA","DVI","アンテナ端子"],"answer_index":0,"explanation":"X1の背面にはHDMIの表記がある。つなぐ機器がHDMI出力かどうかを確認して案内する。","product":"Nebula X1","image":"images/nebula-x1.png","kind":"使い方"},{"id":"neb-14","category":"Nebula","type":"知識","question":"スマホの動画をChromecastでNebulaに映すとき、スマホとプロジェクターは何でつなぐ？","choices":["赤外線","同じWi-Fi（テザリングも可）","NFC","Bluetooth"],"answer_index":1,"explanation":"キャストはBluetoothではなくWi-Fiを使う。「つながらない」と聞かれたら、まず両方が同じWi-Fiにいるかを確認する。","product":"Nebula Capsule 3 Laser","image":"images/capsule-3-laser.jpg","kind":"使い方"},{"id":"neb-15","category":"Nebula","type":"知識","question":"お客さま「スマホのNetflixをミラーリングしたら映らない」。正しい案内は？","choices":["スマホの画面を明るくすると映る","著作権保護のため映せないので、プロジェクター側のアプリで見る","Bluetoothでつなぎ直すと映る","リモコンをペアリングし直すと映る"],"answer_index":1,"explanation":"Netflixなどの著作権保護コンテンツは、ミラーリングもキャストもできない。プロジェクターにアプリを入れて見てもらう。","product":"Nebula Capsule 3 Laser","image":"images/capsule-3-laser.jpg","kind":"使い方"},{"id":"neb-16","category":"Nebula","type":"手順","question":"Androidスマホの動画アプリから、Capsule 3 Laserにキャストする手順を、正しい順に並べよう","choices":["スマホとプロジェクターを同じWi-Fiにつなぐ","YouTubeなどChromecast対応アプリで動画を再生する","画面上部のChromecastボタンを押す","プロジェクターを選ぶ"],"answer_index":0,"explanation":"Wi-Fiは同じものにつなぐ（テザリングでも可）。Netflixなどの著作権保護コンテンツはキャストできない。","product":"Nebula Capsule 3 Laser","image":"images/capsule-3-laser.jpg","kind":"使い方"},{"id":"neb-17","category":"Nebula","type":"手順","question":"Androidスマホの「画面そのもの」をCapsule 3 Laserにミラーリングする手順を、正しい順に並べよう","choices":["スマホとプロジェクターを同じWi-Fiにつなぐ","スマホの Settings から Connected Devices を開く","Connection Preferences の Cast を選ぶ","プロジェクターを選ぶ"],"answer_index":0,"explanation":"動画アプリからのキャストと違い、スマホ本体の設定から始める。メニューの場所はスマホの機種で異なる。","product":"Nebula Capsule 3 Laser","image":"images/capsule-3-laser.jpg","kind":"使い方"},{"id":"neb-18","category":"Nebula","type":"手順","question":"Cosmos 4K SE / Nebula X1のリモコンを、初期設定のあとにペアリングする手順を、正しい順に並べよう","choices":["Settings の Remotes and Accessories で検索を始める","リモコンを本体の赤外線受光部に向ける","OKと音量−を、赤いランプが点滅するまで長押しする","画面で「Nebula Remote」を選び、Pairing をタップする"],"answer_index":0,"explanation":"長押しするのは「OK」と「音量−」。リモコンは本体の受光部に向けて操作する。※アプリのメニュー名は公式サポート（英語）の表記。日本語アプリでは表示が異なる場合がある。","product":"Nebula Cosmos 4K SE","image":"images/cosmos-4k-se.jpg","kind":"使い方"},{"id":"neb-19","category":"Nebula","type":"手順","question":"電源を入れたNebula X1に、LEDが速く点滅しているサテライトスピーカーをつなぐ手順を、正しい順に並べよう","choices":["Settings を開く","Remotes & Accessories を選ぶ","Pair More Official Accessories を選ぶ","画面の案内に従い、LEDが点灯に変われば完了"],"answer_index":0,"explanation":"先に各スピーカーの電源ボタンを、LEDが速く点滅するまで押しておく（入らないときは2回押し）。LEDが「点滅 → 点灯」になれば接続完了。※アプリのメニュー名は公式サポート（英語）の表記。日本語アプリでは表示が異なる場合がある。","product":"Nebula X1","image":"images/nebula-x1.png","kind":"使い方"},{"id":"neb-k01","category":"Nebula","type":"知識","question":"「Cosmos 4K SE」はどんなプロジェクター？","choices":["バッテリーを内蔵した、持ち運びやすいフルHDの小型モデル","3色レーザーと電動ジンバルを備えた、4Kの最上位モデル","着脱式のデュアルスピーカーが付いた、フルHDのモデル","レーザーとLEDを使った、4K・Dolby Vision対応のモデル"],"answer_index":3,"explanation":"光源はレーザー＋LED。4K（Dolby Vision対応）で、最大200インチまで映せる。","product":"Nebula Cosmos 4K SE","image":"images/cosmos-4k-se.jpg","kind":"商品知識"},{"id":"neb-k02","category":"Nebula","type":"数字","question":"「Cosmos 4K SE」の明るさは？","choices":["650ANSIルーメン","1800ANSIルーメン","200ANSIルーメン","3500ANSIルーメン"],"answer_index":1,"explanation":"1800ANSIルーメン。X1は3500、P1は650、Capsule 3は200ANSIルーメン。","product":"Nebula Cosmos 4K SE","image":"images/cosmos-4k-se.jpg","kind":"商品知識"},{"id":"neb-k03","category":"Nebula","type":"知識","question":"「Capsule 3」はどんなプロジェクター？","choices":["電源が必要な、4Kの据え置きモデル","バッテリーを内蔵した、約850gのフルHDモデル","サテライトスピーカーと組み合わせる4Kモデル","着脱式スピーカーが付いた約2.4kgのモデル"],"answer_index":1,"explanation":"フルHDで約850g。バッテリーで約2.5時間再生できる（エコモード）。","product":"Nebula Capsule 3","image":"images/capsule-3.jpg","kind":"商品知識"},{"id":"neb-k04","category":"Nebula","type":"数字","question":"「Capsule 3」の明るさは？","choices":["1000ANSIルーメン","3500ANSIルーメン","1800ANSIルーメン","200ANSIルーメン"],"answer_index":3,"explanation":"200ANSIルーメンで、光源はLED。画面サイズは40〜120インチ。","product":"Nebula Capsule 3","image":"images/capsule-3.jpg","kind":"商品知識"},{"id":"neb-k05","category":"Nebula","type":"知識","question":"「公式プロジェクタージンバルスタンド (Capsuleシリーズ用)」でできることは？","choices":["プロジェクターにつないで、音を大きくする","プロジェクターの映像を、4Kに変換する","水平360°に回し、天井にも投影できるようにする","プロジェクターを置いたまま、バッテリーを充電する"],"answer_index":2,"explanation":"水平360°に回せて、天井投影もできる。対応はCapsuleシリーズなので、機種名を確認する。","product":"Nebula 公式プロジェクタージンバルスタンド (Capsuleシリーズ用)","image":"images/capsule-gimbal-stand.jpg","kind":"商品知識"},{"id":"neb-k06","category":"Nebula","type":"知識","question":"「Mars 3」はどんなプロジェクター？","choices":["バッテリーのない、4K・Dolby Vision対応モデル","バッテリー内蔵でIPX3防水の、フルHDモデル","バッテリー内蔵で約850gの、缶サイズのモデル","3色レーザーと電動ジンバルを備えた4Kモデル"],"answer_index":1,"explanation":"フルHDでバッテリー内蔵、防水はIPX3。別機種の「Mars 3 Air」とは仕様が違うので、箱の名前を確認する。","product":"Nebula Mars 3","image":"images/mars-3.png","kind":"商品知識"},{"id":"neb-k07","category":"Nebula","type":"数字","question":"「Mars 3」のバッテリーは、エコモードで最大何時間もつ？","choices":["1時間","12時間","2.5時間","5時間"],"answer_index":3,"explanation":"エコモードで最大5時間。明るさは1000ANSIルーメン、スピーカーは40W。","product":"Nebula Mars 3","image":"images/mars-3.png","kind":"商品知識"},{"id":"sol-01","category":"ポタ電（Solix）","type":"比較","question":"C1000と比べたとき、C1000 Gen 2のほうが優れている点は？","choices":["拡張バッテリーに対応している","バッテリー容量が大きい","本体が軽い","出力ポートの数が多い"],"answer_index":2,"explanation":"C1000 Gen 2は約11.3kg、C1000は約12.9kg。容量（1024Wh / 1056Wh）、ポート数（10 / 11）、拡張バッテリー対応（－ / ○）はC1000が上。","product":"Anker Solix C1000 Gen 2","image":"images/solix-c1000-gen-2.jpg","kind":"比較"},{"id":"sol-02","category":"ポタ電（Solix）","type":"数字","question":"Solix C1000 Gen 2のバッテリー容量は？","choices":["288Wh","1024Wh","2048Wh","3072Wh"],"answer_index":1,"explanation":"C1000 Gen 2は1024Wh。商品名の1000という数字と結び付けて覚えると、C2000 Gen 2（2048Wh）と比べて説明しやすい。","product":"Anker Solix C1000 Gen 2","image":"images/solix-c1000-gen-2.jpg","kind":"商品知識"},{"id":"sol-03","category":"ポタ電（Solix）","type":"数字","question":"Solix C1000 Gen 2のAC出力（定格）は？","choices":["3000W","300W","1550W","2000W"],"answer_index":2,"explanation":"定格1550W、瞬間最大2300W。使いたい家電のW数が1550W以内かを聞いて案内する。","product":"Anker Solix C1000 Gen 2","image":"images/solix-c1000-gen-2.jpg","kind":"商品知識"},{"id":"sol-04","category":"ポタ電（Solix）","type":"数字","question":"Solix C2000 Gen 2のAC出力（定格）は？","choices":["1550W","2000W","300W","3000W"],"answer_index":1,"explanation":"定格2000W、瞬間最大3300W。C1000 Gen 2は定格1550W。使いたい家電のW数を聞いて機種を選ぶ。","product":"Anker Solix C2000 Gen 2","image":"images/solix-c2000-gen-2.jpg","kind":"商品知識"},{"id":"sol-05","category":"ポタ電（Solix）","type":"比較","question":"この中で、比較表の「最短充電時間」が1時間を切るのは？","choices":["Solix C2000 Gen 2","Solix F3000","Solix C1000 Gen 2","Solix C300"],"answer_index":2,"explanation":"C1000 Gen 2は約54分（アプリで超急速充電モード設定時）。C300は約68分、C2000 Gen 2は約99分、F3000はEV充電スタンドで約1.4時間。アプリの設定が条件である点も伝える。","product":"Anker Solix C1000 Gen 2","image":"images/solix-c1000-gen-2.jpg","kind":"比較"},{"id":"sol-06","category":"ポタ電（Solix）","type":"知識","question":"C1000 Gen 2を「約54分」で充電するために必要なことは？","choices":["専用アプリで超急速充電モードに設定する","拡張バッテリーをつなぐ","本体を冷やしながら充電する","EV充電スタンドで充電する"],"answer_index":0,"explanation":"約54分はアプリで超急速充電モードに設定したときの時間。設定しない通常の充電は約60分。","product":"Anker Solix C1000 Gen 2","image":"images/solix-c1000-gen-2.jpg","kind":"使い方"},{"id":"sol-07","category":"ポタ電（Solix）","type":"おすすめ","question":"お客さま「車中泊で電子レンジ（1000W）を少し使いたい。運ぶので、なるべく軽いものがいい」。どれをすすめる？","choices":["Solix F3000","Solix C2000 Gen 2","Solix C1000 Gen 2","Solix C300"],"answer_index":2,"explanation":"定格1550Wで電子レンジを約0.9時間使え、約11.3kg。C300は300Wで電子レンジの欄が「－」。C2000 Gen 2（約18.9kg）とF3000（約41.5kg）は使えるが重い。","product":"Anker Solix C1000 Gen 2","image":"images/solix-c1000-gen-2.jpg","kind":"お客さん対応"},{"id":"sol-08","category":"ポタ電（Solix）","type":"おすすめ","question":"お客さま「停電に備えたい。あとから拡張バッテリーを足せて、重さは20kgまでのものがいい」。どれをすすめる？","choices":["Solix C300","Solix F3000","Solix C1000 Gen 2","Solix C2000 Gen 2"],"answer_index":3,"explanation":"拡張バッテリー対応で約18.9kg。F3000も対応するが約41.5kg。C300とC1000 Gen 2は拡張バッテリー非対応。","product":"Anker Solix C2000 Gen 2","image":"images/solix-c2000-gen-2.jpg","kind":"お客さん対応"},{"id":"sol-09","category":"ポタ電（Solix）","type":"比較","question":"C2000 Gen 2にはあって、C1000 Gen 2にはないものは？","choices":["拡張バッテリー対応","電子レンジへの給電","ACコンセントからの充電","アプリ対応"],"answer_index":0,"explanation":"拡張バッテリーに対応するのはC2000 Gen 2。ほかの3つはどちらも可能。将来、容量を増やしたいかを聞くのが分かれ目になる。","product":"Anker Solix C2000 Gen 2","image":"images/solix-c2000-gen-2.jpg","kind":"比較"},{"id":"sol-10","category":"ポタ電（Solix）","type":"数字","question":"Solix C2000 Gen 2は、ノートPC（50Wh）を約何回充電できる？","choices":["約16回","約49回","約33回","約5回"],"answer_index":2,"explanation":"C2000 Gen 2は約33回。C1000 Gen 2は約16回なので「およそ2倍」と伝えると分かりやすい。","product":"Anker Solix C2000 Gen 2","image":"images/solix-c2000-gen-2.jpg","kind":"商品知識"},{"id":"sol-11","category":"ポタ電（Solix）","type":"数字","question":"Solix C1000 Gen 2は、iPhone 16を約何回充電できる？","choices":["約18回","約132回","約191回","約60回"],"answer_index":3,"explanation":"C1000 Gen 2は約60回。停電時の備えとして、スマホの充電回数で説明するとイメージしてもらいやすい。","product":"Anker Solix C1000 Gen 2","image":"images/solix-c1000-gen-2.jpg","kind":"商品知識"},{"id":"sol-12","category":"ポタ電（Solix）","type":"数字","question":"Solix C1000 Gen 2で、電気毛布（55Wh）を約何時間使える？","choices":["約38時間","約12時間","約29時間","約4時間"],"answer_index":1,"explanation":"約12時間なので、寒い夜の一晩分が目安。C2000 Gen 2なら約29時間。冬のキャンプや停電の備えで伝えやすい数字。","product":"Anker Solix C1000 Gen 2","image":"images/solix-c1000-gen-2.jpg","kind":"商品知識"},{"id":"sol-13","category":"ポタ電（Solix）","type":"比較","question":"比較表のSolix 5機種すべてに共通しているのは？","choices":["AC出力（定格）が1000W以上","アプリに対応（Bluetooth接続＋Wi-Fi接続）","電子レンジの使用時間が載っている","拡張バッテリーに対応"],"answer_index":1,"explanation":"アプリ対応は全5機種で○。C300は拡張バッテリーと電子レンジの欄が「－」で、AC出力は300W。","product":"Anker Solix C1000 Gen 2","image":"images/solix-c1000-gen-2.jpg","kind":"比較"},{"id":"sol-14","category":"ポタ電（Solix）","type":"知識","question":"「Solix C2000 Gen 2」はどんなポータブル電源？","choices":["拡張バッテリーに対応しない大容量モデル","約4.1kgの小容量モデル","拡張バッテリーに対応した大容量モデル","EV充電スタンドで最短充電する超大容量モデル"],"answer_index":2,"explanation":"2048Whの大容量モデルで、拡張バッテリーに対応。約4.1kgの小容量はC300、EV充電スタンドで最短充電はF3000、拡張非対応の大容量はC1000 Gen 2。","product":"Anker Solix C2000 Gen 2","image":"images/solix-c2000-gen-2.jpg","kind":"商品知識"},{"id":"sol-15","category":"ポタ電（Solix）","type":"数字","question":"Solix C1000 Gen 2のバッテリーは、約何回の充電サイクルに対応する？","choices":["500回以上","300回以上","4000回以上","1000回以上"],"answer_index":2,"explanation":"リン酸鉄リチウムイオン電池で4000回以上・10年が目安。「長く使えますか？」と聞かれたときに答えられる数字。C2000 Gen 2も4000回以上。","product":"Anker Solix C1000 Gen 2","image":"images/solix-c1000-gen-2.jpg","kind":"商品知識"},{"id":"vac-01","category":"掃除機","type":"比較","question":"この中で、吸引力（最大）がいちばん高いのは？","choices":["Omni C28","Auto-Empty C10","Omni S2","Omni E35"],"answer_index":3,"explanation":"E35は35000Pa。最上位のS2は30000Pa、C28は15000Pa、C10は4000Pa。最上位モデルが吸引力でも最大とは限らない（C30 EdgeもE35と同じ35000Pa）。","product":"Anker Eufy Robot Vacuum Omni E35","image":"images/eufy-omni-e35.jpg","kind":"比較"},{"id":"vac-02","category":"掃除機","type":"比較","question":"モップの温水洗浄と、洗剤の自動投入の両方に対応している組み合わせは？","choices":["Omni E35 と Omni C30 Edge","Omni C30 Edge と Omni C28","Omni C28 と Auto-Empty C10","Omni S2 と Omni E35"],"answer_index":3,"explanation":"S2とE35は温水洗浄・温風乾燥・洗剤の自動投入に対応。C30 EdgeとC28は温風乾燥のみで洗剤は手動。手間を減らしたいお客さまには上位2機種を案内する。","product":"Anker Eufy Robot Vacuum Omni E35","image":"images/eufy-omni-e35.jpg","kind":"比較"},{"id":"vac-03","category":"掃除機","type":"数字","question":"Omni S2が乗り越えられる段差は最大どのくらい？（2段の段差の場合）","choices":["約42mm","約30mm","約20mm","約17mm"],"answer_index":0,"explanation":"S2は2段の段差で約42mm、1段の段差で約35mm。ほかはE35が約30mm、C30 EdgeとC28が約20mm、C10が約17mm。部屋の段差の高さを聞いて案内する。","product":"Eufy Robot Vacuum Omni S2","image":"images/eufy-omni-s2.png","kind":"商品知識"},{"id":"vac-04","category":"掃除機","type":"数字","question":"最上位モデル Omni S2 の吸引力（最大）は？","choices":["30000Pa","15000Pa","35000Pa","4000Pa"],"answer_index":0,"explanation":"S2は30000Pa。35000PaはE35とC30 Edge。S2はモップリフト・段差乗り越え・障害物回避が強みなので、そこを説明する。","product":"Eufy Robot Vacuum Omni S2","image":"images/eufy-omni-s2.png","kind":"商品知識"},{"id":"vac-05","category":"掃除機","type":"おすすめ","question":"お客さま「一人暮らしで置き場所が狭い。水拭きはいらないので、コンパクトなロボット掃除機がほしい」。どれをすすめる？","choices":["Auto-Empty C10","Omni C30 Edge","Omni E35","Omni C28"],"answer_index":0,"explanation":"C10は自動ゴミ収集機能付きのコンパクトなモデルで、水拭きはない。水拭きが必要になりそうならC28以上を案内する。","product":"Eufy Robot Vacuum Auto-Empty C10","image":"images/eufy-auto-empty-c10.jpg","kind":"お客さん対応"},{"id":"vac-06","category":"掃除機","type":"数字","question":"Auto-Empty C10の本体の高さは？","choices":["約15cm","約7.2cm","約12cm","約10cm"],"answer_index":1,"explanation":"約7.2cmの薄型。ソファやベッドの下を掃除したいお客さまには、家具の下のすき間の高さを聞いて案内する。","product":"Eufy Robot Vacuum Auto-Empty C10","image":"images/eufy-auto-empty-c10.jpg","kind":"商品知識"},{"id":"vac-07","category":"掃除機","type":"おすすめ","question":"お客さま「小さい子どもとペットがいるので、床の除菌やダニ・アレルゲンの除去もしたい」。どれをすすめる？","choices":["Omni E35","Omni C30 Edge","Auto-Empty C10","Omni C28"],"answer_index":0,"explanation":"店頭の比較表で床面除菌・モップ除菌・ダニ／アレルゲン除去が書かれているのはE35だけ。「徹底除菌」のモデルとして案内する。","product":"Anker Eufy Robot Vacuum Omni E35","image":"images/eufy-omni-e35.jpg","kind":"お客さん対応"},{"id":"vac-08","category":"掃除機","type":"知識","question":"「Omni C28」はどんなモデル？","choices":["自動ゴミ収集機能付きで水拭きのないモデル","サイクロン式でデュアル回転モップのベーシックモデル","ローラーモップ搭載の定番モデル","サイクロン式で徹底除菌のハイエンドモデル"],"answer_index":2,"explanation":"C28はローラーモップ搭載の定番モデル。徹底除菌のハイエンドはE35、水拭きなしはAuto-Empty C10、デュアル回転モップはC30 Edge。","product":"Eufy Robot Vacuum Omni C28","image":"images/eufy-omni-c28.jpg","kind":"商品知識"},{"id":"vac-09","category":"掃除機","type":"おすすめ","question":"お客さま「ラグを敷いているので、水拭きモップができるだけ高く持ち上がるものがいい」。どれをすすめる？","choices":["Omni S2","Omni E35","Omni C30 Edge","Omni C28"],"answer_index":0,"explanation":"モップリフトはS2が約28mm。E35は約11mm、C30 Edgeは約12mm、C28は約10.8mm。ラグの厚みを聞いて案内する。","product":"Eufy Robot Vacuum Omni S2","image":"images/eufy-omni-s2.png","kind":"お客さん対応"},{"id":"vac-10","category":"掃除機","type":"おすすめ","question":"お客さま「部屋の間に約40mmの2段の段差がある。それでも越えられるロボット掃除機はある？」。どれをすすめる？","choices":["Omni C28","Omni C30 Edge","Omni E35","Omni S2"],"answer_index":3,"explanation":"S2は2段の段差なら約42mmまで越えられる（1段の段差は約35mm）。E35は約30mm、C28とC30 Edgeは約20mmまで。","product":"Eufy Robot Vacuum Omni S2","image":"images/eufy-omni-s2.png","kind":"お客さん対応"},{"id":"vac-11","category":"掃除機","type":"比較","question":"C30 EdgeがC28より上回っているのは？","choices":["洗剤の投入方法","乗り越えられる段差の高さ","毛がらみ除去の評価","吸引力（最大）"],"answer_index":3,"explanation":"吸引力はC30 Edgeが35000Pa、C28が15000Pa。段差（約20mm）と洗剤（手動）は同じで、毛がらみ除去はC28のほうが星が多い。","product":"Anker Eufy Robot Vacuum Omni C30 Edge","image":"images/eufy-omni-c30-edge.png","kind":"比較"},{"id":"vac-12","category":"掃除機","type":"知識","question":"この中で、モップが「デュアル回転モップ」なのは？","choices":["Omni C30 Edge","Omni E35","Omni C28","Omni S2"],"answer_index":0,"explanation":"C30 Edgeは伸縮・加圧式のデュアル回転モップ。S2・E35・C28はローラーモップ。モップの種類の違いを聞かれたときに使う。","product":"Anker Eufy Robot Vacuum Omni C30 Edge","image":"images/eufy-omni-c30-edge.png","kind":"商品知識"},{"id":"vac-13","category":"掃除機","type":"比較","question":"この中で、保存できるマップが「最大3枚」なのは？","choices":["Omni E35","Omni S2","Omni C28","Auto-Empty C10"],"answer_index":3,"explanation":"C10は最大3枚、S2・E35・C28は最大5枚。複数の階で使いたいお客さまへの確認ポイント。","product":"Eufy Robot Vacuum Auto-Empty C10","image":"images/eufy-auto-empty-c10.jpg","kind":"比較"},{"id":"vac-14","category":"掃除機","type":"知識","question":"Auto-Empty C10の初回マッピング（部屋の地図作り）について、正しいのは？","choices":["水拭きしながら進める","マッピング中は吸引しない","人が本体を持って部屋を一周する","必ず一晩かかる"],"answer_index":1,"explanation":"マッピング中は吸引せず、約93㎡で約20分が目安。「吸わないけど故障？」と聞かれたら、地図作り中だと説明できる。","product":"Eufy Robot Vacuum Auto-Empty C10","image":"images/eufy-auto-empty-c10.jpg","kind":"使い方"},{"id":"vac-15","category":"掃除機","type":"知識","question":"ロボット掃除機の初回マッピングの前に、お客さまにお願いする準備は？","choices":["部屋のドアをすべて開け、コードやおもちゃを片付ける","部屋のドアをすべて閉め、電気を消す","ステーションを電源から外しておく","床に水をまいておく"],"answer_index":0,"explanation":"ドアを開けておくと全部の部屋を地図にでき、コードなどを片付けるとからまりを防げる。マッピング中は本体を手で動かさないことも伝える。","product":"Eufy Robot Vacuum Auto-Empty C10","image":"images/eufy-auto-empty-c10.jpg","kind":"使い方"},{"id":"vac-16","category":"掃除機","type":"手順","question":"Omni E35のマップが不正確なとき、作り直す手順を、正しい順に並べよう","choices":["Settings の Map Management で今のマップを削除する","ドア全開・照明オン・床の片付けをして、アプリで Quick Mapping を実行する","できたマップを確認する","必要なら部屋の結合・分割や名前の変更をする"],"answer_index":0,"explanation":"Quick Mappingは通常5〜15分で、掃除はせずに地図だけを作る。明るくして、床を片付けてから実行するのがコツ。※アプリのメニュー名は公式サポート（英語）の表記。日本語アプリでは表示が異なる場合がある。","product":"Anker Eufy Robot Vacuum Omni E35","image":"images/eufy-omni-e35.jpg","kind":"使い方"},{"id":"vac-17","category":"掃除機","type":"手順","question":"Omni S2で、別のフロアのマップを追加する手順を、正しい順に並べよう","choices":["本体だけを新しいフロアに運び、ドアを開けて床を片付ける","アプリの Map Management を開く","Create Map をタップする","終わるまで本体を動かさない","本体が開始地点に戻ったら完了"],"answer_index":0,"explanation":"ステーションは動かさなくてよい。S2はマップを最大5枚まで保存できる。※アプリのメニュー名は公式サポート（英語）の表記。日本語アプリでは表示が異なる場合がある。","product":"Eufy Robot Vacuum Omni S2","image":"images/eufy-omni-s2.png","kind":"使い方"},{"id":"vac-k01","category":"掃除機","type":"数字","question":"「Omni E35」の吸引力（最大）は？","choices":["35000Pa","30000Pa","15000Pa","4000Pa"],"answer_index":0,"explanation":"35000Paのサイクロン式。S2は30000Pa、C28は15000Pa、C10は4000Pa。","product":"Anker Eufy Robot Vacuum Omni E35","image":"images/eufy-omni-e35.jpg","kind":"商品知識"},{"id":"vac-k02","category":"掃除機","type":"知識","question":"「Omni E35」の水拭きの方式は？","choices":["伸縮加圧式ローラーモップ","水拭き機能はない","手で押して使うモップ","伸縮加圧式デュアル回転モップ"],"answer_index":0,"explanation":"伸縮加圧式ローラーモップ（約1.6kg）。モップは温水洗浄・温風乾燥、洗剤は自動投入。","product":"Anker Eufy Robot Vacuum Omni E35","image":"images/eufy-omni-e35.jpg","kind":"商品知識"},{"id":"cam-01","category":"カメラ系","type":"比較","question":"この中で、バッテリー稼働時間が「約365日」なのは？","choices":["Solar Wall Light Cam S120","eufyCam S330 2-Cam Kit","SoloCam S340","SoloCam C210"],"answer_index":1,"explanation":"eufyCam S330は約365日、S340とC210は約90日。S120は公式では約60日（店頭の比較表では約90日）。使い方で変わる目安なので「検出の頻度などで変わります」と添える。","product":"Eufy eufyCam S330 2-Cam Kit","image":"images/eufycam-s330-2-cam-kit.jpg","kind":"比較"},{"id":"cam-02","category":"カメラ系","type":"数字","question":"SoloCam S340のバッテリー稼働時間の目安は？","choices":["約7日","約30日","約365日","約90日"],"answer_index":3,"explanation":"約90日。さらにソーラーパネルを搭載しているので、日当たりのよい場所なら充電の手間を減らせる。","product":"Eufy SoloCam S340","image":"images/solocam-s340.jpg","kind":"商品知識"},{"id":"cam-03","category":"カメラ系","type":"数字","question":"Indoor Cam S350のレンズの解像度は？","choices":["広角 最大4K ＋ 望遠 最大2K","最大4K（レンズ1つ）","最大2K（レンズ1つ）","広角 最大3K ＋ 望遠 最大2K"],"answer_index":0,"explanation":"S350は広角4Kと望遠2K。同じ広角＋望遠でも、屋外用のSoloCam S340は広角3K＋望遠2Kなので区別して案内する。","product":"Eufy Security Indoor Cam S350","image":"images/indoor-cam-s350.png","kind":"商品知識"},{"id":"cam-04","category":"カメラ系","type":"知識","question":"「SoloCam S340」はどんなカメラ？","choices":["ソーラーパネル搭載で、自動追尾もできる屋外用カメラ","電源ケーブルでつなぐ屋内用カメラ","ソーラーパネルのない固定式の屋外用カメラ","壁掛けライトと一体になった固定式のカメラ"],"answer_index":0,"explanation":"広角と望遠のデュアルレンズで、ソーラーパネルと自動追尾を備えた屋外用。店頭の比較表の屋外用4機種で自動追尾が○なのはS340だけ。","product":"Eufy SoloCam S340","image":"images/solocam-s340.jpg","kind":"商品知識"},{"id":"cam-05","category":"カメラ系","type":"おすすめ","question":"お客さま「部屋の中で、動くペットを自動で追いかけて、望遠でもアップで見たい」。どれをすすめる？","choices":["eufyCam S330 2-Cam Kit","Indoor Cam C220","Indoor Cam S350","SoloCam S340"],"answer_index":2,"explanation":"屋内用で自動追尾ができ、広角4K＋望遠2Kの2つのレンズを備えるのはS350。C220も屋内用で自動追尾だが、望遠レンズはない。S340とeufyCam S330は屋外用。","product":"Eufy Security Indoor Cam S350","image":"images/indoor-cam-s350.png","kind":"お客さん対応"},{"id":"cam-06","category":"カメラ系","type":"おすすめ","question":"お客さま「部屋の中を4Kで見守りたい。夜もカラーで映るものがいい」。どれをすすめる？","choices":["Indoor Cam E30","Wired Cam C31","Indoor Cam C220","Indoor Cam S350"],"answer_index":0,"explanation":"E30は屋内用・4K・カラーのナイトビジョン。S350は4Kだが夜はモノクロ、C220は2Kで夜はモノクロ、C31は夜もカラーだがフルHD。","product":"Eufy Indoor Cam E30","image":"images/indoor-cam-e30.jpg","kind":"お客さん対応"},{"id":"cam-07","category":"カメラ系","type":"おすすめ","question":"お客さま「留守中、部屋の中で動き回る犬を自動で追って映してほしい。画質は2Kで十分」。どれをすすめる？","choices":["HomeBase S380","SoloCam C210","Indoor Cam C220","Smart Display E10"],"answer_index":2,"explanation":"C220は屋内用で、水平360°に動いて自動追尾もできる2Kカメラ。C210は屋外用の固定式、S380は録画の保存機器、E10は映像を見るための画面。","product":"Eufy Indoor Cam C220","image":"images/indoor-cam-c220.jpg","kind":"お客さん対応"},{"id":"cam-08","category":"カメラ系","type":"おすすめ","question":"お客さま「家の外壁に、ライトとカメラが一緒になったものを付けたい。ソーラー充電で、画質は2Kで十分」。どれをすすめる？","choices":["SoloCam C210","eufyCam S330 2-Cam Kit","Wall Light Cam S4","Solar Wall Light Cam S120"],"answer_index":3,"explanation":"S120はセンサーライト一体型でソーラーパネル搭載の2Kカメラ。固定式で自動追尾はない。Wall Light Cam S4も一体型だが、こちらは4K。","product":"Eufy Solar Wall Light Cam S120","image":"images/solar-wall-light-cam-s120.jpg","kind":"お客さん対応"},{"id":"cam-09","category":"カメラ系","type":"おすすめ","question":"お客さま「ライト一体型のカメラで、外を4Kで撮りたい」。どれをすすめる？","choices":["Wall Light Cam
