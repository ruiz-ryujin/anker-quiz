する屋内用カメラ","録画を保存するためのホームベース","正面用と荷物用の2つのカメラが付いたドアホン"],"answer_index":3,"explanation":"正面用（2K）と荷物用（1080p）のデュアルカメラ。「S330」は屋外カメラのeufyCam S330 2-Cam Kitにも付くので、商品の種類まで確認する。","product":"Video Doorbell (Wired) S330","image":"images/video-doorbell-s330.png","kind":"商品知識"},{"id":"cam-15","category":"カメラ系","type":"知識","question":"Video Doorbell S330をすすめる前に、必ず確認することは？","choices":["毎月の保存料金を払えるか","有線式なので、電源の配線（16〜24VAC）があるか","家にソーラーパネルを置けるか","microSDカードを持っているか"],"answer_index":1,"explanation":"バッテリーのない有線式。映像は本体内蔵8GBに保存し、月額は無料。配線がない家には向かないので、最初に設置環境を聞く。","product":"Video Doorbell (Wired) S330","image":"images/video-doorbell-s330.png","kind":"商品知識"},{"id":"cam-16","category":"カメラ系","type":"知識","question":"eufyCam S330 2-Cam Kitに付属している機器は？","choices":["Smart Display E10","HomeBase S380","SoloCam C210","Video Doorbell S330"],"answer_index":1,"explanation":"HomeBase S380が付属し、録画の保存先になる。ほかの対応カメラを選ぶお客さまには、HomeBase S380を組み合わせる提案もできる。","product":"Eufy HomeBase S380","image":"images/homebase-s380.jpg","kind":"商品知識"},{"id":"cam-17","category":"カメラ系","type":"知識","question":"「HomeBase S380」の役割は？","choices":["カメラの映像を家の中で保存する（月額不要）","スマホを充電する","カメラにソーラーで電気を送る","カメラ映像を大画面に映す"],"answer_index":0,"explanation":"カメラ映像をローカル保存でき、月額料金がかからない。内蔵16GBで、HDD/SSDを追加すると最大16TBまで増やせる。","product":"Eufy HomeBase S380","image":"images/homebase-s380.jpg","kind":"商品知識"},{"id":"cam-18","category":"カメラ系","type":"数字","question":"HomeBase S380は、HDD/SSDを追加すると最大どのくらいまで保存できる？","choices":["16TB","1TB","4TB","256GB"],"answer_index":0,"explanation":"内蔵は16GB、HDD/SSDの追加で最大16TB。「16GB」と「16TB」を言い間違えないようにする。","product":"Eufy HomeBase S380","image":"images/homebase-s380.jpg","kind":"商品知識"},{"id":"cam-19","category":"カメラ系","type":"知識","question":"お客さま「eufyCam S330のカメラを、HomeBaseなしで使いたい」。正しい案内は？","choices":["Wi-Fiにつなげば単体で使える","カメラ単体では使えず、HomeBaseが必要","microSDカードを入れれば単体で使える","Bluetoothでスマホにつなげば使える"],"answer_index":1,"explanation":"eufyCam S330はHomeBaseが必須の機種。2-Cam KitにはHomeBase S380が付属するので、そのまま使い始められる。","product":"Eufy eufyCam S330 2-Cam Kit","image":"images/eufycam-s330-2-cam-kit.jpg","kind":"商品知識"},{"id":"cam-20","category":"カメラ系","type":"知識","question":"「Smart Display E10」はどんな商品？","choices":["カメラの映像を最大4つまで映せる8インチ画面","首振りする屋内用カメラ","映像を保存するためのハードディスク","ソーラーで充電する屋外用ライト"],"answer_index":0,"explanation":"8インチの画面にカメラ映像を最大4つ表示できる。持ち運びも壁掛けもでき、スマホを開かずに確認したいお客さまに。","product":"Eufy Smart Display E10","image":"images/smart-display-e10.jpg","kind":"商品知識"},{"id":"cam-21","category":"カメラ系","type":"知識","question":"「eufyCam C35」の特徴は？","choices":["マグネットで取り付けられる、バッテリー式のカメラ","ソーラーパネル付きの、ライト一体型カメラ","電源ケーブルでつなぐ、首振りカメラ","広角と望遠のデュアルレンズカメラ"],"answer_index":0,"explanation":"マグネット取り付けの固定式で、屋外でも屋内でも使える。IP67、バッテリーは約90日。録画はmicroSD（最大256GB）。","product":"Eufy eufyCam C35","image":"images/eufycam-c35.jpg","kind":"商品知識"},{"id":"cam-22","category":"カメラ系","type":"おすすめ","question":"お客さま「充電の手間なく使いたいので有線がいい。屋外でも使えて、人を自動で追いかけるカメラは？」。どれをすすめる？","choices":["eufyCam C35","SoloCam C210","Wired Cam C31","Indoor Cam S350"],"answer_index":2,"explanation":"C31は有線（ACアダプタ）で、屋外でも屋内でも使える。水平360°の首振りと自動追尾に対応。C210とC35はバッテリー式の固定カメラ、S350は屋内用。","product":"Eufy Wired Cam C31","image":"images/wired-cam-c31.jpg","kind":"お客さん対応"},{"id":"cam-23","category":"カメラ系","type":"手順","question":"アプリの Add Device で「HomeBase 3」を選んだあと、HomeBase S380を追加する手順を、正しい順に並べよう","choices":["HomeBaseをルーターのLANポートに有線でつなぎ、電源を入れる","スマホを同じルーターのWi-Fiにつなぎ、LEDが赤から青に変わるのを待つ","本体のQRコードを読み取る","音が鳴ったら、SYNC/ALARM OFFボタンを2秒長押しする","接続後、名前を付ける"],"answer_index":0,"explanation":"アプリでは「HomeBase 3」と表示される。最初はルーターに有線でつなぐこと、スマホも同じルーターのWi-Fiに入れることがポイント。※アプリのメニュー名は公式サポート（英語）の表記。日本語アプリでは表示が異なる場合がある。","product":"Eufy HomeBase S380","image":"images/homebase-s380.jpg","kind":"使い方"},{"id":"cam-24","category":"カメラ系","type":"手順","question":"eufyCam S330のカメラを、HomeBase S380につなぐ手順を、正しい順に並べよう","choices":["先にHomeBaseをアプリに追加しておく","アプリの Add Device から eufyCam 3 を選ぶ","接続先にHomeBaseを選ぶ","カメラのSYNCボタンを2秒長押しする（短いビープ音）","Next をタップし、HomeBaseがカメラを見つけるのを待つ","カメラに名前を付ける"],"answer_index":0,"explanation":"必ずHomeBaseが先、カメラがあと。アプリではeufyCam S330は「eufyCam 3」、HomeBase S380は「HomeBase 3」と表示される。※アプリのメニュー名は公式サポート（英語）の表記。日本語アプリでは表示が異なる場合がある。","product":"Eufy eufyCam S330 2-Cam Kit","image":"images/eufycam-s330-2-cam-kit.jpg","kind":"使い方"},{"id":"cam-k01","category":"カメラ系","type":"知識","question":"「Solar Wall Light Cam S120」はどんなカメラ？","choices":["電源ケーブルでつなぐ、水平360°に首振りする屋内カメラ","ソーラーパネル搭載の、センサーライト一体型の屋外カメラ","ソーラーパネル搭載で、首振りと自動追尾ができる屋外カメラ","HomeBase S380が付属する、4Kの屋外カメラ2台セット"],"answer_index":1,"explanation":"屋外の固定式で、センサーライト一体型。ソーラーパネルを搭載し、最大2K。","product":"Eufy Solar Wall Light Cam S120","image":"images/solar-wall-light-cam-s120.jpg","kind":"商品知識"},{"id":"cam-k02","category":"カメラ系","type":"数字","question":"「Solar Wall Light Cam S120」のライトの明るさは最大どのくらい？","choices":["30ルーメン","100ルーメン","3000ルーメン","300ルーメン"],"answer_index":3,"explanation":"最大300ルーメン。ナイトビジョンはカラーで、記録は本体内蔵8GB。","product":"Eufy Solar Wall Light Cam S120","image":"images/solar-wall-light-cam-s120.jpg","kind":"商品知識"},{"id":"cam-k03","category":"カメラ系","type":"知識","question":"「SoloCam C210」はどんなカメラ？","choices":["ソーラーパネル付きの、自動追尾する屋外カメラ","ソーラーパネル付きの、ライト一体型屋外カメラ","ソーラーなしの、バッテリー式の屋外固定カメラ","電源ケーブルでつなぐ、首振りする屋内カメラ"],"answer_index":2,"explanation":"屋外の固定式で、バッテリーは約90日（最大3ヶ月）。ソーラーはなく、最大2K。","product":"Eufy Security SoloCam C210","image":"images/solocam-c210.png","kind":"商品知識"},{"id":"cam-k04","category":"カメラ系","type":"知識","question":"「SoloCam C210」の記録方法は？","choices":["本体内蔵8GB（microSDは非対応）","本体内蔵64GB（microSDで増設できる）","NAS（本体への内蔵はなし）","microSDカード（本体への内蔵はなし）"],"answer_index":0,"explanation":"本体内蔵8GBに記録する。microSDカードには対応していない。","product":"Eufy Security SoloCam C210","image":"images/solocam-c210.png","kind":"商品知識"},{"id":"cam-k05","category":"カメラ系","type":"知識","question":"「Indoor Cam C220」はどんなカメラ？","choices":["ソーラーで動き、センサーライトが付いた屋外用の2Kカメラ","マグネットで取り付ける、バッテリー式のフルHDカメラ","広角と望遠の2つのレンズを備えた、屋外用のカメラ","水平360°に首振りして自動追尾する、屋内用の2Kカメラ"],"answer_index":3,"explanation":"屋内用で最大2K。水平360°／垂直75°の首振りと自動追尾に対応する。","product":"Eufy Indoor Cam C220","image":"images/indoor-cam-c220.jpg","kind":"商品知識"},{"id":"cam-k06","category":"カメラ系","type":"知識","question":"「Indoor Cam C220」の電源は？","choices":["電源ケーブル","内蔵バッテリー（約90日）","ソーラーパネル","単3形乾電池"],"answer_index":0,"explanation":"電源ケーブルでつなぐ。設置場所の近くにコンセントがあるかを確認する。","product":"Eufy Indoor Cam C220","image":"images/indoor-cam-c220.jpg","kind":"商品知識"},{"id":"cam-k07","category":"カメラ系","type":"知識","question":"「Wall Light Cam S4」はどんなカメラ？","choices":["最大4Kの、センサーライト一体型の屋外カメラ","フルHDの、マグネットで付けるカメラ","最大4Kの、首振りする屋内カメラ","正面用と荷物用の2つのカメラが付いたドアホン"],"answer_index":0,"explanation":"屋外のセンサーライト一体型で、最大4K。ソーラーは延長ケーブルで離して設置できる。","product":"Eufy Wall Light Cam S4","image":"images/eufy-wall-light-cam-s4.png","kind":"商品知識"},{"id":"cam-k08","category":"カメラ系","type":"数字","question":"「Wall Light Cam S4」の本体内蔵の保存容量は？","choices":["8GB","32GB","64GB","16GB"],"answer_index":1,"explanation":"本体内蔵32GB。S120の内蔵は8GB。","product":"Eufy Wall Light Cam S4","image":"images/eufy-wall-light-cam-s4.png","kind":"商品知識"},{"id":"cam-k09","category":"カメラ系","type":"知識","question":"「Wired Cam C31」の電源は？","choices":["ボタン電池","有線（ACアダプタ）","内蔵バッテリー（約365日）","ソーラーパネル"],"answer_index":1,"explanation":"有線（ACアダプタ）で、屋外でも屋内でも使える。自動追尾にも対応する。","product":"Eufy Wired Cam C31","image":"images/wired-cam-c31.jpg","kind":"商品知識"},{"id":"cam-k10","category":"カメラ系","type":"知識","question":"「Wired Cam C31」の解像度は？","choices":["最大3K","最大2K","最大4K","フルHD"],"answer_index":3,"explanation":"フルHDで、ナイトビジョンはカラー。記録はmicroSD最大256GB（別売り）。","product":"Eufy Wired Cam C31","image":"images/wired-cam-c31.jpg","kind":"商品知識"},{"id":"cam-k11","category":"カメラ系","type":"知識","question":"「eufyCam C37」はどんなカメラ？","choices":["電源ケーブルでつなぎ、首振りと自動追尾ができる屋内カメラ","有線式で、正面用と荷物用の2つのカメラが付いたドアホン","センサーライト一体型で、首振りをしない固定式の屋外カメラ","ソーラーパネルが付属し、首振りと自動追尾ができる屋外カメラ"],"answer_index":3,"explanation":"屋外用で水平360°／垂直90°の首振りと自動追尾に対応し、ソーラーが付属する。別商品「C37 4K」もあるので、箱の表記を確認する。","product":"Eufy eufyCam C37","image":"images/eufycam-c37.png","kind":"商品知識"},{"id":"cam-k12","category":"カメラ系","type":"知識","question":"「Indoor Cam E30」はどんなカメラ？","choices":["夜はモノクロの、屋内用の2Kカメラ","ソーラーで動く、屋外用の4Kカメラ","夜もカラーで映る、屋内用の4Kカメラ","カメラの映像を映す8インチの画面"],"answer_index":2,"explanation":"屋内用の4Kで、ナイトビジョンはカラー。水平360°／垂直75°の首振りと自動追尾に対応する。","product":"Eufy Indoor Cam E30","image":"images/indoor-cam-e30.jpg","kind":"商品知識"},{"id":"cam-k13","category":"カメラ系","type":"知識","question":"「Indoor Cam E30」の記録に使うのは？","choices":["本体内蔵8GBのメモリだけ","USBメモリや外付けSSD","付属のmicroSDカードだけ","microSDカード（別売り）やNAS"],"answer_index":3,"explanation":"microSD最大128GB（別売り）かNASに記録する。HomeBase S380にも対応する。","product":"Eufy Indoor Cam E30","image":"images/indoor-cam-e30.jpg","kind":"商品知識"},{"id":"spk-01","category":"スピーカー","type":"おすすめ","question":"お客さま「バーベキューで、みんなに聞こえるようにパワフルに音楽を流したい」。どれをすすめる？","choices":["Select 4 Go","Soundcore 3","SoundCore 2","soundcore Boom 3i"],"answer_index":3,"explanation":"Boom 3iは50Wでいちばんパワフル。Soundcore 3は16W、SoundCore 2は12W、Select 4 Goは5W。ストラップ付きで持ち運びもしやすい。","product":"Soundcore Boom 3i","image":"images/soundcore-boom-3i.jpg","kind":"お客さん対応"},{"id":"spk-02","category":"スピーカー","type":"おすすめ","question":"お客さま「海で使いたい。海水がかかっても大丈夫なスピーカーがいい」。どれをすすめる？","choices":["Soundcore 3","SoundCore 2","soundcore Boom 3i","Q31i"],"answer_index":2,"explanation":"Boom 3iは耐海水で、水に浮く。防塵防水はIP68。Soundcore 3とSoundCore 2はIPX7で、Q31iはヘッドホン。","product":"Soundcore Boom 3i","image":"images/soundcore-boom-3i.jpg","kind":"お客さん対応"},{"id":"spk-03","category":"スピーカー","type":"おすすめ","question":"お客さま「リュックに入れて持ち歩く。音量はほどほどでいいので、とにかく軽いスピーカーがほしい」。どれをすすめる？","choices":["SoundCore 2","soundcore Boom 3i","Select 4 Go","Soundcore 3"],"answer_index":2,"explanation":"Select 4 Goは約265gでいちばん軽い。SoundCore 2は約400g、Soundcore 3は約500g、Boom 3iは約825g。IP67で雨の心配も少ない。","product":"Soundcore Select 4 Go","image":"images/soundcore-select-4-go.jpg","kind":"お客さん対応"},{"id":"spk-04","category":"スピーカー","type":"比較","question":"この中で、防塵防水が「IP68」のスピーカーは？","choices":["Select 4 Go","soundcore Boom 3i","SoundCore 2","Soundcore 3"],"answer_index":1,"explanation":"Boom 3iはIP68、Select 4 GoはIP67、Soundcore 3とSoundCore 2はIPX7（防水のみの表記）。砂やほこりのある場所なら防塵の有無も確認する。","product":"Soundcore Boom 3i","image":"images/soundcore-boom-3i.jpg","kind":"比較"},{"id":"spk-05","category":"スピーカー","type":"数字","question":"Boom 3iの出力は？","choices":["12W","16W","50W","5W"],"answer_index":2,"explanation":"50W。SoundCore 2は12W、Soundcore 3は16W、Select 4 Goは5W。使う場所の広さを聞いて選ぶ。","product":"Soundcore Boom 3i","image":"images/soundcore-boom-3i.jpg","kind":"商品知識"},{"id":"spk-06","category":"スピーカー","type":"数字","question":"Soundcore 3の再生時間は最大何時間？","choices":["16時間","24時間","8時間","20時間"],"answer_index":1,"explanation":"最大24時間。SoundCore 2も24時間、Select 4 Goは20時間、Boom 3iは16時間。","product":"Soundcore 3","image":"images/soundcore-3.jpg","kind":"商品知識"},{"id":"spk-07","category":"スピーカー","type":"比較","question":"この中で、再生時間がいちばん短いスピーカーは？","choices":["SoundCore 2","Soundcore 3","soundcore Boom 3i","Select 4 Go"],"answer_index":2,"explanation":"Boom 3iは最大16時間。Select 4 Goは20時間、Soundcore 3とSoundCore 2は24時間。Boom 3iは大出力、ほかは長時間、と強みを分けて案内する。","product":"Soundcore Boom 3i","image":"images/soundcore-boom-3i.jpg","kind":"比較"},{"id":"spk-08","category":"スピーカー","type":"知識","question":"この中で「スピーカー」はどれ？","choices":["Boom 3i","Q31i","K20i","P42i"],"answer_index":0,"explanation":"Boom 3iがスピーカー。K20iとP42iはイヤホン、Q31iはヘッドホン。「i」が付く名前が多いので、頭のシリーズ名で区別する。","product":"Soundcore Boom 3i","image":"images/soundcore-boom-3i.jpg","kind":"商品知識"},{"id":"spk-09","category":"スピーカー","type":"知識","question":"SoundCore 2を2台使ってステレオで鳴らしたいお客さまに、確認することは？","choices":["スマホがAndroidかどうか","2台ともUSB Type-C充電版かどうか","有線ケーブルを持っているか","2台の色が同じかどうか"],"answer_index":1,"explanation":"2台でのステレオペアリングは、USB Type-C版同士のみ。買い足しのお客さまには、お持ちの1台の充電端子を聞く。","product":"Anker SoundCore 2","image":"images/anker-soundcore-2.jpg","kind":"使い方"},{"id":"spk-10","category":"スピーカー","type":"知識","question":"Boom 3iは、Bluetoothで同時に何台の機器とつなげる？","choices":["1台だけ","4台まで","8台まで","2台まで"],"answer_index":3,"explanation":"同時に2台まで接続できる。新しい機器をつなぐときは、Bluetoothボタンを音が鳴って青く点滅するまで押す。","product":"Soundcore Boom 3i","image":"images/soundcore-boom-3i.jpg","kind":"使い方"},{"id":"spk-11","category":"スピーカー","type":"手順","question":"SoundCore 2をスマホとBluetoothでつなぐ手順を、正しい順に並べよう","choices":["スピーカーのBluetoothボタンを押す","ランプが点滅したのを確認する","スマホのBluetoothをいったんオフにし、もう一度オンにする","スマホでスピーカーを検索して接続する"],"answer_index":0,"explanation":"公式サポートの「見つからない・つながらない」ときの流れ。点滅（ペアリング待ち）にしてから、スマホ側で探す。","product":"Anker SoundCore 2","image":"images/anker-soundcore-2.jpg","kind":"使い方"},{"id":"spk-12","category":"スピーカー","type":"手順","question":"SoundCore 2を2台つないでステレオにする（TWS）手順を、正しい順に並べよう","choices":["2台の電源を入れる","両方のBluetoothボタンを数秒長押しする（両方が青点滅）","約5〜8秒待ち、ビープ音が鳴れば2台の接続は成功","スマホを親機とペアリングする"],"answer_index":0,"explanation":"SoundCore 2は、先にスピーカー同士をつなぎ、スマホは最後。2台は5m以内に置く。","product":"Anker SoundCore 2","image":"images/anker-soundcore-2.jpg","kind":"使い方"},{"id":"spk-13","category":"スピーカー","type":"手順","question":"Soundcore 3がPartyCastに入れないとき、リセットからつなぎ直す手順を、正しい順に並べよう","choices":["2台とも、電源＋音量＋を5〜10秒長押ししてリセットする","1台目をスマホとBluetooth接続する","1台目のBluetoothボタンを3秒以上長押しする（白のゆっくり点滅）","2台目のBluetoothボタンを長押しし、白のゆっくり点滅になったら2回押す","1台目が白点滅、2台目が白点灯になれば成功"],"answer_index":0,"explanation":"PartyCastは、複数のスピーカーで同じ音を流す機能。SoundCore 2のTWSとは逆に、先に1台目をスマホにつなぐ。","product":"Soundcore 3","image":"images/soundcore-3.jpg","kind":"使い方"},{"id":"spk-14","category":"スピーカー","type":"手順","question":"Soundcoreアプリをダウンロードしたあと、アプリ対応スピーカーの音質（EQ）を調整する手順を、正しい順に並べよう","choices":["スピーカーをスマホとBluetooth接続する","Soundcoreアプリを開く","アプリ上でも接続されていることを確認する","Equalizer Settings でEQを調整する"],"answer_index":0,"explanation":"Soundcore 3はアプリ対応。スマホとのBluetooth接続だけでなく、アプリの画面でも「接続済み」になっているかを確認する。※アプリのメニュー名は公式サポート（英語）の表記。日本語アプリでは表示が異なる場合がある。","product":"Soundcore 3","image":"images/soundcore-3.jpg","kind":"使い方"},{"id":"spk-k01","category":"スピーカー","type":"数字","question":"「Select 4 Go」の再生時間は最大何時間？","choices":["20時間","48時間","10時間","5時間"],"answer_index":0,"explanation":"最大20時間。出力は5Wで、約265gと軽い。","product":"Soundcore Select 4 Go","image":"images/soundcore-select-4-go.jpg","kind":"商品知識"},{"id":"spk-k02","category":"スピーカー","type":"知識","question":"「Select 4 Go」でできることは？","choice <script type="application/json" id="glossary">{"terms":[{"t":"GaN（窒化ガリウム）","d":"充電器を小さくしながら出力を高くしやすい、窒化ガリウムという半導体の素材。「Anker GaN II」は、これを使ったAnker独自の技術の名前。","f":["Anker GaN II","GaN"]},{"t":"USB PD（USB Power Delivery）","d":"USB-Cで大きな電力を送るための急速充電の規格。スマホからノートPCまで、充電器と機器の両方が対応していると速く充電できる。","f":["PD","USB PD"]},{"t":"PPS","d":"USB PDの拡張機能（Programmable Power Supply）。充電中の電圧と電流を機器に合わせて細かく調整し、効率よく充電する。","f":["PPS"]},{"t":"Quick Charge","d":"Qualcomm社の急速充電の規格。2.0や3.0は世代を表し、充電器と機器の両方が対応していると速く充電できる。","f":["Quick Charge 2.0/3.0"]},{"t":"Qi","d":"ワイヤレス充電の国際的な規格で、「チー」と読む。対応したスマホやイヤホンを、充電パッドに置くだけで充電できる。","f":["Qi"]},{"t":"Qi2","d":"ワイヤレス充電の規格「Qi」の新しい世代で、磁石で充電の位置を合わせる方式に対応した。最大15Wで充電できる。","f":["Qi2"]},{"t":"Qi2 25W","d":"ワイヤレス充電の規格「Qi2」のうち、最大25Wに対応したもの。従来のQi2（最大15W）より速く充電できる。","f":["Qi2 25W"]},{"t":"AirCool","d":"Anker Primeのワイヤレス充電器の名前に付く言葉で、充電中の熱を冷却ファンで冷やす仕組み。","f":["AirCool"]},{"t":"ペルチェ素子","d":"電気を流すと片面が冷たくなる部品。ワイヤレス充電器では、冷却ファンと組み合わせて充電中の熱を抑える。","f":["ペルチェ素子"]},{"t":"パススルー充電","d":"モバイルバッテリー本体を充電しながら、つないだ機器も同時に充電できる機能。","f":["パススルー充電"]},{"t":"低電流モード","d":"ワイヤレスイヤホンやスマートウォッチなど、小さな機器に合った弱めの電流で充電するモード。","f":["低電流モード"]},{"t":"ネオリチウムイオンバッテリー","d":"Ankerが独自に開発した、安全性を高めたバッテリーセル。釘刺し試験もクリアする。","f":["ネオリチウムイオンバッテリー"]},{"t":"釘刺し試験","d":"バッテリーに釘を刺し、わざと内部でショートさせて安全性を確かめる試験。","f":["釘刺し試験"]},{"t":"mAh（ミリアンペアアワー）","d":"バッテリーにためられる電気の量を表す単位。数字が大きいほど容量が大きく、充電できる回数が増える。","f":["10000mAh","20000mAh","25000mAh","5000mAh"]},{"t":"プラグの形（A・C・G・Iタイプ）","d":"コンセントの形の種類で、国や地域によって違う。日本はAタイプ、オーストラリアなどはIタイプ。","f":["A・C・Gタイプ","Iタイプ"]},{"t":"AC","d":"交流の略で、家庭のコンセントと同じ種類の電気のこと。AC差込口は、家電などのプラグを挿す所。","f":["AC"]},{"t":"Lightning（ライトニング）","d":"Appleの充電端子。iPhoneは14シリーズまでがLightning、15シリーズ以降はUSB-Cになった。","f":["Lightning"]},{"t":"LDAC","d":"ソニーが開発した、Bluetoothで高音質の音を送るためのコーデック（音の圧縮方式）。SBCやAACより多くの音の情報を送れる。","f":["LDAC"]},{"t":"SBC","d":"Bluetoothで音を送るときの標準的なコーデック（音の圧縮方式）。","f":["SBC"]},{"t":"AAC","d":"Bluetoothで音を送るときのコーデック（音の圧縮方式）の1つ。iPhoneなどで使われる。","f":["AAC"]},{"t":"コーデック","d":"音をBluetoothなどで送るための圧縮の方式。イヤホンとスマホの両方が対応している方式で音が送られる。","f":["コーデック"]},{"t":"ハイレゾ","d":"ハイレゾリューションの略で、CDより情報量が多い高音質の音のこと。","f":["ハイレゾ"]},{"t":"AUX","d":"音声ケーブルを使う有線接続のこと。スマホやPCなどとヘッドホンをケーブルでつなぐ。","f":["AUX"]},{"t":"Dolby Audio","d":"ドルビー社の音響技術。soundcoreでは、音に包まれるように聴こえる3Dオーディオ（立体音響）の機能として搭載されている。","f":["Dolby Audio","Dolbyの音響効果"]},{"t":"Dolby Atmos","d":"ドルビー社の立体音響の技術。音を前後左右や上下に配置し、包み込まれるように聴こえる。","f":["Dolby Atmos"]},{"t":"立体音響（3Dオーディオ）","d":"音に囲まれているように、音の方向や広がりを感じられる音の鳴らし方。","f":["3Dオーディオ","立体音響"]},{"t":"ノイズキャンセリング（NC）","d":"周りの騒音をマイクで拾い、打ち消す音を出して聞こえにくくする機能。NCやANCと略す。","f":["NC","アクティブノイズキャンセリング","ノイズキャンセリング"]},{"t":"ウルトラノイズキャンセリング","d":"soundcoreのノイズキャンセリング機能の名前。3.0、3.5、4.0のように数字が付き、大きいほど新しい世代。","f":["ウルトラノイズキャンセリング"]},{"t":"Thus","d":"Ankerが独自に開発したAIチップの名前。ウルトラノイズキャンセリング 4.0のイヤホンやヘッドホンに搭載されている。","f":["Thus"]},{"t":"外音取り込み","d":"イヤホンやヘッドホンを着けたまま、周りの音や声をマイクで拾って聞けるようにする機能。","f":["外音取り込み"]},{"t":"マルチポイント","d":"1つのイヤホンやヘッドホンを、スマホとPCなど複数の機器に同時につないでおける機能。","f":["マルチポイント","マルチポイント接続"]},{"t":"HearID","d":"Soundcoreアプリの機能。聴こえ方に合わせて、自分用のイコライザー（EQ）を作れる。","f":["HearID"]},{"t":"イコライザー（EQ）","d":"低音や高音など、音域ごとの強さを変えて音質を調整する機能。EQと略す。","f":["EQ","イコライザー"]},{"t":"ドライバー","d":"イヤホンやヘッドホンの中で、電気信号を音に変える部品。「40mm」などの数字は大きさを表す。","f":["ドライバー"]},{"t":"ダイナミック（型ドライバー）","d":"ドライバー（音を出す部品）の方式の1つ。磁石とコイルで振動板を動かして音を出す。","f":["ダイナミック"]},{"t":"骨伝導センサー","d":"話すときに骨を伝わる振動を感じ取るセンサー。マイクと合わせて、通話などで自分の声を拾いやすくする。","f":["骨伝導センサー"]},{"t":"オープンイヤー","d":"耳の穴をふさがずに着けるイヤホンの形。音楽を聴きながら周りの音も聞こえる。","f":["オープンイヤー","オープンイヤーイヤホン"]},{"t":"イヤーカフ型","d":"耳たぶの横など、耳のふちに挟んで着けるイヤホンの形。","f":["イヤーカフ型"]},{"t":"イヤーフック","d":"耳に掛けて支える部品のこと。これが付いた形をイヤーフック型と呼び、動いても外れにくい。","f":["イヤーフック","イヤーフック型"]},{"t":"インナーイヤー型","d":"耳の穴の奥まで入れず、耳の入り口に引っ掛けて着けるイヤホンの形。耳栓のような密閉感が少ない。","f":["インナーイヤー型"]},{"t":"装着検出","d":"着けているか外しているかをセンサーで感じ取る機能。","f":["装着検出"]},{"t":"FlexiCurve構造","d":"Space One Proに使われている、ヘッドホンを小さく折りたためる構造の名前。","f":["FlexiCurve構造"]},{"t":"IP等級（防塵・防水の規格）","d":"防塵・防水の強さを表す国際規格。IPの次の数字が防塵（0〜6）、その次が防水（0〜8）で、大きいほど強く、Xはその項目の等級を表示していないという意味。","f":["IP54","IP55","IP57","IP65","IP67","IP68","IPX3","IPX4","IPX5","IPX7"]},{"t":"ファームウェア","d":"機器の中に入っていて、その機器を動かすソフト。アプリから新しいものに更新できる機器もある。","f":["ファームウェア"]},{"t":"ペアリング","d":"Bluetooth機器とスマホなどを、初めて使うときに登録してつなぐこと。ペアリングモードは、相手から見つけてもらえる待ち受けの状態。","f":["ペアリング","ペアリングモード"]},{"t":"ステレオペアリング","d":"同じスピーカー2台をつなぎ、左右に分けてステレオで鳴らすこと。","f":["ステレオペアリング"]},{"t":"TWS","d":"True Wireless Stereoの略。soundcoreのスピーカーでは、同じ機種2台を無線でつなぎ、左右のステレオで鳴らす機能。","f":["TWS"]},{"t":"PartyCast","d":"soundcoreのスピーカーの機能。複数台をつないで、同じ音を同時に流せる。","f":["PartyCast"]},{"t":"ANSIルーメン","d":"プロジェクターの明るさを表す単位で、ANSI（米国規格協会）が定めた方法で測ったもの。数字が大きいほど明るい。","f":["1000ANSIルーメン","1800ANSIルーメン","200ANSIルーメン","300ANSIルーメン","3500ANSIルーメン","650ANSIルーメン","ANSIルーメン"]},{"t":"ルーメン","d":"光の量を表す単位で、数字が大きいほど明るい。","f":["300ルーメン"]},{"t":"解像度（フルHD・2K・4Kなど）","d":"映像の細かさのこと。フルHD（1080p）は1920×1080画素、4Kは3840×2160画素で、2Kや3Kはその間、6Kや8Kは4Kよりさらに細かい。","f":["1080p","2K","3K","4K","6K","8K","フルHD","解像度"]},{"t":"Dolby Vision","d":"ドルビー社の映像技術。明るい所から暗い所までの表現や色を、より豊かに見せる。","f":["Dolby Vision"]},{"t":"Google TV","d":"Googleのテレビ向けの仕組み（OS）。対応するプロジェクターは、動画配信などのアプリを入れて使える。","f":["Google TV"]},{"t":"Chromecast","d":"スマホの動画などを、テレビやプロジェクターの大画面に映して見るためのGoogleの機能。","f":["Chromecast"]},{"t":"キャスト","d":"スマホの対応アプリから、動画などをテレビやプロジェクターに送って映すこと。","f":["キャスト"]},{"t":"ミラーリング","d":"スマホの画面を、そのままテレビやプロジェクターに映すこと。","f":["ミラーリング"]},{"t":"テザリング","d":"スマホの通信を使って、ほかの機器をインターネットにつなぐ機能。","f":["テザリング"]},{"t":"ジンバルスタンド","d":"プロジェクターを載せて、上下や水平の向きを変えられるスタンド。","f":["ジンバルスタンド"]},{"t":"サテライトスピーカー","d":"本体とは別に、離れた場所に置いて使うスピーカー。Nebula X1ではワイヤレスでつなぐ。","f":["サテライトスピーカー"]},{"t":"HDMI","d":"映像と音声を1本のケーブルで送る端子の規格。テレビ、ゲーム機、PCなどで使われる。","f":["HDMI"]},{"t":"HDMI 2.1","d":"映像と音声を送る規格「HDMI」の、大容量の映像に対応した世代。最大48Gbpsで、8K（60Hz）や4K（120Hz）の映像を送れる。","f":["HDMI 2.1"]},{"t":"DisplayPort","d":"PCとモニターなどをつなぐ、映像と音声の端子の規格。","f":["DisplayPort"]},{"t":"Hz（ヘルツ）","d":"1秒あたりの回数を表す単位。映像では1秒間に画面を書き換える回数を表し、大きいほど動きがなめらかに見える。","f":["120Hz","60Hz"]},{"t":"Gbps","d":"1秒間に送れるデータの量を表す単位（ギガビット毎秒）。数字が大きいほど速い。","f":["48Gbps"]},{"t":"デュアルディスプレイ","d":"PCにモニターを2枚つないで使うこと。","f":["デ // 問題文に対象商品の名前がある時だけ「写真＋名前」を出す。無い時は答えがバレるので出さない（回答後に商品カードで見せる）
function shot(q){
  const list = (PICS.shots || {})[q.id];
  return list && h('div', { class:'shot' + (isProducts(q) ? ' sm' : '') }, list.map(([p, name]) =>
    h('figure', {}, img(p, name, 'figure'), h('figcaption', {}, name))));
}
// 選択肢が商品名の問題か（1つでも写真が引ければ商品名の問題。写真が無い選択肢は「写真なし」と出す）
const isProducts = q => q.type !== '手順' && q.choices.some(t => picsOf(t).length);
const answerNames = q => rights(q).map(i => h('span', { class:'picname' }, picsOf(q.choices[i]).map(p => img(p, '')), h('b', {}, q.choices[i])));
/* ---- 用語解説 ----
   どこが用語かは build/glossary.py が前もって調べてある（最長一致・商品名の中は除く）。文が変わって位置がずれていたら、その文は青文字にしない */
const GLOSS = (() => { try { return JSON.parse(document.getElementById('glossary').textContent); } catch (_) { return {}; } })();
const $gloss = document.getElementById('gloss');
const held = q => (GLOSS.hold || []).includes(q.id);   // 用語の意味を問う問題：問題文の用語は回答後に青文字にする（答え漏れ防止）
function gloss(q, text, key){
  const marks = ((GLOSS.marks || {})[q.id] || {})[key] || [], out = [];
  if (!marks.every(([s, e, n]) => GLOSS.terms[n] && GLOSS.terms[n].f.includes(text.slice(s, e)))) return [text];
  let at = 0;
  for (const [s, e, n] of marks) {
    if (s > at) out.push(text.slice(at, s));
    out.push(termEl(GLOSS.terms[n], text.slice(s, e)));
    at = e;
  }
  if (at < text.length) out.push(text.slice(at));
  return out;
}
function termEl(term, word){
  const open = () => openGloss(term, word, el);
  const el = h('span', { class:'term', role:'button', tabindex:'0', 'aria-controls':'gloss', onclick:open,
    onkeydown: ev => { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); open(); } } }, word);
  return el;
}
let glossFrom = null;   // パネルを開いた用語（閉じた時に戻る場所）
function openGloss(term, word, el){
  if (glossFrom) glossFrom.classList.remove('on');
  glossFrom = el; el.classList.add('on');
  const t = document.getElementById('gloss-t');
  t.textContent = term.t;
  if (!term.t.includes(word)) t.append(h('span', { class:'as' }, word));   // 「IP68」など、本文での書き方が用語名と違う時
  document.getElementById('gloss-d').textContent = term.d;
  $gloss.hidden = false;
  $gloss.querySelector('.tx').scrollTop = 0;
  document.documentElement.style.setProperty('--gh', $gloss.offsetHeight + 'px');
  const over = el.getBoundingClientRect().bottom - (innerHeight - 100);   // パネルの分だけ下がって隠れたら、見える所まで戻す
  if (over > 0) window.scrollBy(0, over);
}
function closeGloss(back){
  if ($gloss.hidden) return;
  $gloss.hidden = true;
  document.documentElement.style.removeProperty('--gh');
  if (glossFrom) { glossFrom.classList.remove('on'); if (back && document.contains(glossFrom)) glossFrom.focus({ preventScroll:true }); }
  glossFrom = null;
}
function screen(node, opt = {}){
  closeGloss();
  while ($app.firstChild) $app.removeChild($app.firstChild);   // replaceChildren は古い WebView に無い
  $app.append(node);
  $bar.hidden = !opt.quiz; $quit.hidden = !opt.quiz; $foot.hidden = !!opt.quiz;
  window.scrollTo(0, 0);
  const t = node.querySelector('[data-focus]'); if (t && opt.focus !== false) t.focus({ preventScroll:true });
}
// アプリ内 WebView では history が使えない（例外になる）ことがある。その時は履歴なしで動かす
function inQuiz(){ try { return !!(history.state && history.state.in); } catch (_) { return false; } }
let pushed = false;   // 履歴が本当に1つ増えたか（about:blank に流し込む WebView では増えず、back() が効かない）
function enter(){
  if (inQuiz()) return;
  try { const n = history.length; history.pushState({ in:true }, ''); pushed = history.length > n; } catch (_) { pushed = false; }
}
function leave(){
  const back = inQuiz() && pushed, stay = () => { try { history.replaceState(null, ''); } catch (_) {} home(); };
  if (!back) return stay();
  let done = false;
  addEventListener('popstate', () => { done = true; }, { once:true });
  history.back();
  setTimeout(() => { if (!done) stay(); }, 400);   // 戻れなかったら画面だけ戻す
}

/* ---- ホーム ---- */
function tile(c, o){
  return h('li', {}, h('button', { class:'cat' + (o.mix ? ' mix' : ''), type:'button', disabled:o.disabled, onclick:o.go },
    h('span', { class:'pic' }, c.pic.map(p => img('images/' + p, ''))),
    h('span', { class:'txt' }, h('span', { class:'name' }, c.label || c.id), c.desc && h('span', { class:'desc' }, c.desc), h('span', { class:'cnt' }, o.cnt))));
}
function home(){
  run = null;
  const marked = markedList(), grid = h('ul', { class:'grid kinds' }, KINDS.map(k => tile(k, { cnt:`${ALL.filter(q => q.kind === k.id).length}問`, go:() => fields(k) })),
    tile(MIX, { mix:true, cnt:`全分野からランダム・全${ALL.length}問`, go:mixMenu }));
  screen(h('div', { class:'wrap' },
    h('div', { class:'hero' }, h('h1', { tabindex:'-1', 'data-focus':true }, '商品クイズ'),
      h('p', {}, '「どれがいい？」「どう使うの？」に答えるための、店舗スタッフ用クイズ。')),
    marked.length > 0 && h('button', { class:'btn ghost marked', type:'button', onclick: startMarked }, `チェックした問題だけやる（${marked.length}問）`), grid), { focus:false });
}
function fields(k){
  run = null; enter();
  screen(h('div', { class:'wrap' },
    h('div', { class:'sub' }, h('button', { class:'btn ghost back', type:'button', onclick: leave }, '← 種類をえらぶ'),
      h('h1', { tabindex:'-1', 'data-focus':true }, k.id), h('p', {}, '分野をえらんでください。問題の順番は毎回変わります。')),
    h('ul', { class:'grid' }, CATS.map(c => {
      const pool = ALL.filter(q => q.kind === k.id && q.category === c.id);
      return tile(c, { cnt: pool.length ? `${pool.length}問` : 'まだ問題がありません', disabled:!pool.length, go:() => startField(k, c, pool) });
    }))));
}
function startField(k, c, pool){
  countMenu({ title:`${k.id}：${c.label}`, key:k.id + '|' + c.id, kind:k, pool }, () => fields(k));
}
function mixMenu(){
  enter();
  countMenu({ title:'ミックス', key:MIX.id, pool:ALL }, leave);
}
// 問題数選択（種類×分野のすべてとミックス）。プールより多い数は選べない。目立たせるのは10問、10問に足りない分野では全問
const COUNTS = [10, 20, 30];
function countMenu(o, back){
  const all = o.pool.length, few = all < COUNTS[0];
  const pick = (n, label, main) => h('button', { class:'btn' + (main ? '' : ' ghost'), type:'button', disabled:n > all,
    onclick: () => begin(Object.assign({}, o, { count:n })) }, label);
  screen(h('div', { class:'wrap narrow' },
    h('button', { class:'btn ghost back', type:'button', onclick: back }, '← 戻る'),
    h('h1', { tabindex:'-1', 'data-focus':true, style:'margin-top:20px' }, o.title),
    h('p', { class:'lead' }, '問題数を選んでください。ランダムに選んで、1問ずつ出します。'),
    h('div', { class:'stack row' }, COUNTS.map(n => pick(n, `${n}問`, n === COUNTS[0])), pick(all, `全問（${all}問）`, few)),
    all < COUNTS[COUNTS.length - 1] && h('p', { class:'hint' }, `${o.title.split('：').pop()}は全部で${all}問です。これより多い数は選べません。`)));
}

/* ---- シャッフル ----
   毎回ランダムな順。問題数を絞った時は、まだ解いていない問題から先に出す（くり返せば全問が1周する）。
   解いた問題の id だけをこの端末に覚える。保存できない環境では、開いている間だけ覚える */
const SEEN = (() => { try { const v = JSON.parse(localStorage.getItem('ankerQuizSeen')); return v && typeof v === 'object' ? v : {}; } catch (_) { return {}; } })();
function keepSeen(){ try { localStorage.setItem('ankerQuizSeen', JSON.stringify(SEEN)); } catch (_) {} }
function draw(key, pool, count){
  if (count >= pool.length) return { list: shuffle(pool) };
  const seen = new Set(SEEN[key] || []), fresh = shuffle(pool.filter(q => !seen.has(q.id)));
  if (fresh.length >= count) return { list: fresh.slice(0, count) };
  SEEN[key] = []; keepSeen();   // 1周した：残りを全部出し、足りない分を次の周から先に出す（残りは前の周の分なので、次の周では数えない）
  return { list: shuffle(fresh.concat(shuffle(pool.filter(q => seen.has(q.id))).slice(0, count - fresh.length))), last: new Set(fresh.map(q => q.id)) };
}
function markSeen(q){
  if (run.review || run.last && run.last.has(q.id)) return;
  const a = SEEN[run.key] || (SEEN[run.key] = []);
  if (!a.includes(q.id)) { a.push(q.id); keepSeen(); }
}

/* ---- チェック（ブックマーク） ----
   付けた問題の id をこの端末に保存する。保存できない環境では、開いている間だけ覚える */
const CHECK_KEY = 'ankerQuizChecked';
let checks = [], canSave = true;
function checkedIds(){   // 別のタブで付け外しした分も反映するため、毎回読み直す
  if (canSave) try { const v = JSON.parse(localStorage.getItem(CHECK_KEY) || '[]'); checks = Array.isArray(v) ? v : []; } catch (e) { if (!(e instanceof SyntaxError)) canSave = false; else checks = []; }
  return checks;
}
function toggleCheck(id){
  const a = checkedIds(), on = !a.includes(id);
  checks = on ? a.concat(id) : a.filter(x => x !== id);
  if (canSave) try { localStorage.setItem(CHECK_KEY, JSON.stringify(checks)); } catch (_) { canSave = false; }
  return on;
}
const markedList = () => [...new Set(checkedIds())].map(id => ALL.find(q => q.id === id)).filter(Boolean);   // 付けた順
function startMarked(){
  const pool = shuffle(markedList());
  if (pool.length) begin({ title:'チェックした問題', pool, count:pool.length, review:true, checked:true });
}
function checkButton(q){
  const t = document.createElement('template');
  t.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12v18l-6-4.5L6 21z"/></svg>';
  const b = h('button', { class:'chk', type:'button', 'aria-pressed': String(checkedIds().includes(q.id)), onclick: () => b.setAttribute('aria-pressed', toggleCheck(q.id)) },
    t.content.firstChild, 'チェック');
  return b;
}

/* ---- 出題 ---- */
function begin(o){
  enter();
  run = Object.assign({ review:false }, { last:null }, o, o.review ? { list: o.pool.slice() } : draw(o.key, o.pool, o.count), { i:0, log:[] });   // 復習は同じ問題を同じ順で出す
  ask();
}
function ask(){
  const q = run.list[run.i], order = q.type === '手順';
  const ans = h('div', { class:'answers' + (isProducts(q) ? ' pics' : '') }), after = h('div', { 'aria-live':'polite' });
  const pic = shot(q), body = h('div', { class:'body' }, pic, ans);
  const root = h('div', { class:'wrap quiz' + (pic ? ' has-shot' : '') },
    h('div', { class:'meta' },
      h('span', {}, h('strong', {}, `${run.i + 1}`), ` / ${run.list.length}問目`),
      h('span', { class:'tag' }, tagOf(q)),
      h('span', {}, (run.checked ? 'チェック・' : run.review ? '復習・' : '') + labelOf(q.category))),
    h('h1', { class:'q', tabindex:'-1', 'data-focus':true }, held(q) ? q.question : gloss(q, q.question, 'q')), body,
    h('div', { class:'qbar' }, checkButton(q), h('button', { class:'pass', type:'button', onclick: () => pass(q) }, 'パス')), after);
  screen(root, { quiz:true });
  setBar(run.i);
  (order ? orderUI : q.answer_indexes ? multiUI : choiceUI)(q, ans, after, root);
}
// パス：判定せずに次へ。「解いた問題」には数えない（まだの問題として後でまた出る）
function pass(q){
  run.log.push({ q, pass:true });
  advance();
}
function advance(){ run.i++; run.i < run.list.length ? ask() : result(); }
function setBar(n){
  $bar.firstElementChild.style.width = (n / run.list.length * 100) + '%';
  $bar.setAttribute('aria-valuemax', run.list.length); $bar.setAttribute('aria-valuenow', n);
}
function ph(t){ const ps = picsOf(t); return h('span', { class:'ph' + (ps.length ? '' : ' none') }, ps.length ? ps.map(p => img(p, '')) : '写真なし'); }
function choiceUI(q, box, after, root){
  const items = shuffle(q.choices.map((t, i) => ({ t, i }))), prod = isProducts(q);
  items.forEach((it, n) => {
    it.b = h('button', { class:'opt', type:'button', onclick: () => {
      const ok = it.i === q.answer_index;
      items.forEach(x => {
        x.b.disabled = true;
        x.b.classList.add(x.i === q.answer_index ? 'ok' : x === it ? 'ng' : 'dim');
        if (x.i === q.answer_index) x.b.querySelector('.k').textContent = '○';
        else if (x === it) x.b.querySelector('.k').textContent = '×';
      });
      settle(q, ok, after, root);
    } }, prod && ph(it.t), h('span', { class:'k', 'aria-hidden':'true' }, String(n + 1)), h('span', { class:'w' }, it.t));
    box.append(it.b);
  });
}
// 複数選択：タップで選び「確定」で判定。選んだ組み合わせが正解とぴったり同じなら正解
function multiUI(q, box, after, root){
  const right = rights(q), items = shuffle(q.choices.map((t, i) => ({ t, i, on:false }))), prod = isProducts(q);
  const hint = h('p', { class:'hint' }, `あてはまるものを${right.length}つ選んで「確定」を押してください。もう一度タップすると取り消せます。`);
  const ok = h('button', { class:'btn', type:'button', disabled:true, onclick: () => {
    const good = items.every(x => x.on === right.includes(x.i));
    items.forEach(x => {
      const yes = right.includes(x.i), k = x.b.querySelector('.k');
      x.b.disabled = true; x.b.classList.remove('on');
      x.b.classList.add(yes ? 'ok' : x.on ? 'ng' : 'dim');
      if (yes) k.textContent = '○'; else if (x.on) k.textContent = '×';
      if (yes && !x.on) x.b.querySelector('.w').append(h('small', {}, '選んでいない正解'));
    });
    hint.remove(); tools.remove();
    settle(q, good, after, root);
  } }, '確定');
  const clr = h('button', { class:'btn ghost', type:'button', disabled:true, onclick: () => { items.forEach(x => { x.on = false; }); redraw(); } }, '選び直す');
  const tools = h('div', { class:'tools' }, clr, ok);
  function redraw(){
    items.forEach(x => { x.b.classList.toggle('on', x.on); x.b.setAttribute('aria-pressed', x.on); });
    ok.disabled = clr.disabled = !items.some(x => x.on);
  }
  box.append(hint);
  items.forEach((x, n) => {
    x.b = h('button', { class:'opt', type:'button', onclick: () => { x.on = !x.on; redraw(); } },
      prod && ph(x.t), h('span', { class:'k', 'aria-hidden':'true' }, String(n + 1)), h('span', { class:'w' }, x.t));
    box.append(x.b);
  });
  box.append(tools); redraw();
}
function orderUI(q, box, after, root){
  let items = q.choices.map((t, i) => ({ t, i }));
  do { items = shuffle(items); } while (items.length > 1 && items.every((x, i) => x.i === i));  // 最初から正解の並びにはしない
  let picked = [];
  const ok = h('button', { class:'btn', type:'button', disabled:true, onclick: () => {
    const good = picked.every((x, i) => x.i === i);
    items.forEach(x => { x.b.disabled = true; x.b.hidden = true; });
    hint.hidden = true; tools.remove();
    settle(q, good, after, root, picked);
    box.remove();
  } }, '確定');
  const clr = h('button', { class:'btn ghost', type:'button', disabled:true, onclick: () => { picked = []; draw(); } }, '選び直す');
  const hint = h('p', { class:'hint' }, '正しい順にタップしてください。もう一度タップすると取り消せます。');
  const tools = h('div', { class:'tools' }, clr, ok);
  function draw(){
    items.forEach(x => {
      const n = picked.indexOf(x);
      x.b.classList.toggle('on', n >= 0);
      x.b.setAttribute('aria-pressed', n >= 0);
      x.b.setAttribute('aria-label', (n >= 0 ? (n + 1) + '番目：' : '') + x.t);
      x.b.querySelector('.k').textContent = n >= 0 ? n + 1 : '';
    });
    ok.disabled = picked.length !== items.length; clr.disabled = !picked.length;
  }
  box.append(hint);
  items.forEach(x => {
    x.b = h('button', { class:'opt', type:'button', onclick: () => {
      const n = picked.indexOf(x);
      if (n >= 0) picked.splice(n, 1); else picked.push(x);
      draw();
    } }, h('span', { class:'k', 'aria-hidden':'true' }), h('span', { class:'w' }, x.t));
    box.append(x.b);
  });
  box.append(tools); draw();
}
function settle(q, ok, after, root, picked){
  run.log.push({ q, ok }); markSeen(q);
  setBar(run.i + 1);
  const last = run.i + 1 >= run.list.length, fb = h('section', { class:'fb ' + (ok ? 'good' : 'bad') },
    h('h2', { class:'verdict', tabindex:'-1' }, icon(ok), ok ? '正解！' : '不正解'));
  if (q.type === '手順') {
    fb.append(h('p', { class:'right' }, '正しい順番'),
      h('ol', { class:'steps' }, q.choices.map((t, i) => {
        const at = picked.findIndex(p => p.i === i);
        return h('li', { class: at === i ? '' : 'miss' }, h('span', { class:'k' }, String(i + 1)),
          h('span', { class:'w' }, t, at !== i && h('small', {}, `あなたの回答：${at + 1}番目`)));
      })));
  } else if (!ok) {
    fb.append(h('p', { class:'right' }, h('span', {}, '正解は'), answerNames(q)));
  }
  if (q.type === 'おすすめ') {
    const ps = productsOf(q), two = ps.length > 1;
    fb.append(h('div', { class:'card' },
      two ? h('div', { class:'ph two' }, ps.map(p => h('figure', {}, img(p.image, p.name), h('figcaption', {}, p.name)))) : h('div', { class:'ph' }, img(q.image, q.product, '.ph')),
      h('div', { class:'bd' }, h('div', { class:'lbl' }, two ? 'こんな商品！どちらもおすすめできます' : 'こんな商品！'), h('h3', {}, two ? q.group : q.product),
        h('div', { class:'pt' }, 'おすすめポイント'), h('p', {}, gloss(q, q.explanation, 'e')))));
  } else {
    fb.append(h('p', { class:'exp' }, gloss(q, q.explanation, 'e')),
      h('div', { class:'mini' }, img(q.image, ''), h('b', {}, q.product)));
  }
  after.append(fb);
  if (held(q)) { const t = root.querySelector('.q'); t.textContent = ''; t.append(...gloss(q, q.question, 'q')); }
  const go = h('button', { class:'btn', type:'button', onclick: advance }, last ? '結果を見る' : '次へ');
  const qbar = root.querySelector('.qbar');
  root.append(h('div', { class:'next' }, h('div', { class:'wrap' }, qbar.querySelector('.chk'), go)));   // チェックは回答後も付けられる。パスは消す
  qbar.remove();
  if (q.type === '手順') root.classList.remove('has-shot'), root.querySelector('.shot') && root.querySelector('.shot').remove();
  go.focus({ preventScroll:true });
  fb.scrollIntoView({ block: fb.offsetHeight > innerHeight - 180 ? 'start' : 'nearest', behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' });
}

/* ---- 結果 ---- */
function result(){
  if (!run.log.length) return leave();
  const { log } = run, done = log.filter(x => !x.pass), passed = log.length - done.length;   // 正答率はパスを除いて数える
  const good = done.filter(x => x.ok).length, wrong = done.filter(x => !x.ok).map(x => x.q);
  const marked = markedList(), again = [...new Set(wrong.concat(marked))];   // 間違えた問題＋チェックした問題（重なりは1回だけ）
  const cats = [...new Set([...CATS.map(c => c.id)])].map(id => {
    const r = log.filter(x => x.q.category === id), n = r.filter(x => !x.pass).length, g = r.filter(x => x.ok).length;
    return { id, n, p:r.length - n, g, pct: n ? Math.round(g / n * 100) : 0 };
  }).filter(x => x.n || x.p);
  const prev = run, origin = prev.origin || prev;
  const review = pool => begin({ title:prev.title, key:prev.key, kind:prev.kind, pool, count:pool.length, review:true, origin });
  screen(h('div', { class:'wrap narrow' },
    h('h1', { tabindex:'-1', 'data-focus':true }, '結果'),
    h('p', { class:'lead' }, run.title + (run.review && !run.checked ? '（復習）' : '') + (log.length < run.list.length ? `・${run.list.length}問中${done.length}問に回答` : '')),
    h('div', { class:'score' },
      done.length > 0 && h('div', { class:'big' }, String(Math.round(good / done.length * 100)), h('small', {}, '%')),
      h('div', { class:'of' }, done.length ? `${done.length}問中 ${good}問正解` : '回答した問題はありません')),
    h('dl', { class:'tally' }, [['正解', good, 'g'], ['不正解', wrong.length, 'b'], ['パス', passed, 'p']].map(([t, n, c]) =>
      h('div', { class:c }, h('dt', {}, t), h('dd', {}, String(n))))),
    again.length > 0 && h('div', { class:'actions' },
      h('button', { class:'btn', type:'button', onclick: () => review(again) }, `間違えた・チェックした問題だけやる（${again.length}問）`),
      wrong.length > 0 && h('button', { class:'btn ghost', type:'button', onclick: () => review(wrong) }, `間違えた${wrong.length}問を復習`)),
    marked.length > 0 && h('p', { class:'hint' }, `間違えた問題 ${wrong.length}問・チェックした問題 ${marked.length}問（前に付けた分も含む。重なりは1回だけ出します）`),
    h('div', { class:'actions' },
      (!origin.checked || marked.length > 0) && h('button', { class:'btn' + (again.length ? ' ghost' : ''), type:'button',
        onclick: () => origin.checked ? startMarked() : begin({ title:origin.title, key:origin.key, kind:origin.kind, pool:origin.pool, count:origin.count }) }, 'もう一度'),
      prev.kind && h('button', { class:'btn ghost', type:'button', onclick: () => fields(prev.kind) }, '分野をえらぶ'),
      h('button', { class:'btn ghost', type:'button', onclick: leave }, 'ホームへ')),
    h('h2', { class:'sec' }, '分野ごとの結果'),
    h('ul', { class:'res' }, cats.map(c => h('li', {},
      h('div', { class:'ln' }, h('span', {}, labelOf(c.id)), h('span', {}, [c.n && `${c.g} / ${c.n}（${c.pct}%）`, c.p && `パス${c.p}`].filter(Boolean).join('・'))),
      h('div', { class:'meter' }, h('i', { style:`width:${c.pct}%` })))))));
}

/* ---- 起動 ---- */
$quit.addEventListener('click', () => run && result());
document.getElementById('brand').addEventListener('click', () => {
  if (run && run.log.length && !$bar.hidden && !confirm('クイズを終了してホームに戻りますか？')) return;
  leave();
});
addEventListener('popstate', home);
document.getElementById('gloss-x').addEventListener('click', () => closeGloss(true));
addEventListener('keydown', e => {
  if (e.key === 'Escape') return closeGloss(true);
  if (e.ctrlKey || e.metaKey || e.altKey || !/^[1-9]$/.test(e.key)) return;
  const b = document.querySelectorAll('.answers .opt')[e.key - 1];
  if (b && !b.disabled) b.click();
});
/*BUILD:load*/
async function load(){
  try {
    const r = await fetch('questions.json', { cache:'no-cache' });
    if (!r.ok) throw new Error(r.status);
    return await r.json();
  } catch (_) {
    return JSON.parse(document.getElementById('embedded-questions').textContent);
  }
}
/*END:load*/
// 起動に失敗しても黒画面のままにしない：静的な控え（単一ファイル版の #nojs）があれば残し、無ければ理由を出す
function bootFailed(e){
  const why = document.getElementById('why'), msg = 'エラー：' + (e && e.message || e);
  if (why) { why.textContent = msg; return; }
  $app.textContent = '問題を読み込めませんでした。' + msg;
}
(async () => {
  try {
    ALL = await load();
    if (!ALL || !ALL.length) throw new Error('問題データが空です');
    try { if (inQuiz()) history.replaceState(null, ''); } catch (_) {}
    home();
  } catch (e) { bootFailed(e); }
})();
</script>
